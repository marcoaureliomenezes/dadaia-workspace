name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check if version needs releasing
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.check.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-tags: true
      - id: check
        name: Compare pyproject version vs existing tags
        run: |
          pyver=$(grep -E '^version *= *"' pyproject.toml | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "version=$pyver" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$pyver" | grep -q "v$pyver"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$pyver already exists — skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version v$pyver — proceeding with release."
          fi

  unit-fast:
    name: Unit fast (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow" tests/unit

  contract-coverage:
    name: Contract coverage (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        run: poetry run pytest -q -m "unit or contract" --cov=dadaia_workspace --cov-report=term-missing --cov-fail-under=80 tests/unit tests/contract

  integration:
    name: Integration (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest integration
        run: poetry run pytest -q -m integration tests/integration --durations=30

  e2e-python:
    name: E2E Python (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest e2e python
        run: poetry run pytest -q -m e2e tests/e2e/features --durations=30

  e2e-panel:
    name: E2E panel (Playwright)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: Bootstrap panel workspace
        run: |
          poetry run python -m dadaia_workspace.cli.main init --workspace "$PWD" --skip-assets
          poetry run python -m dadaia_workspace.cli.main public stage
          mkdir -p repos
          ln -sfn "$PWD" repos/dadaia-workspace
          cat > .dadaia/states/spec_contexts.json <<JSON
          {
            "schema_version": "2",
            "contexts": [
              {
                "name": "dadaia-workspace",
                "state": "alive",
                "repo_slug": "dadaia-workspace",
                "repo_url": "https://github.com/marcoaureliomenezes/dadaia-workspace.git",
                "created_at": "2026-06-03T00:00:00+00:00",
                "alive_since": "2026-06-03T00:00:00+00:00",
                "dead_since": null,
                "current_branch": "main"
              }
            ]
          }
          JSON
          cat > .dadaia/states/primary_context.json <<JSON
          {
            "name": "dadaia-workspace",
            "repo_slug": "dadaia-workspace",
            "specs_dir": "$PWD/specs"
          }
          JSON
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Node deps
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: playwright panel e2e
        env:
          PANEL_WEB_SERVER_COMMAND: poetry run python -m dadaia_workspace.cli.main panel --port 4999 --no-open
        run: npm run test:e2e

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [check, unit-fast, contract-coverage, integration, e2e-python, e2e-panel]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: Build artifacts
        run: poetry build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ needs.check.outputs.version }}
          path: dist/

  approve:
    name: Approve release to PyPI
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.skip == 'false'
    environment: release-gate
    timeout-minutes: 60
    steps:
      - name: Release approved
        run: echo "Release v${{ needs.check.outputs.version }} approved — proceeding to publish."

  publish:
    name: Publish to PyPI (OIDC trusted publishing)
    runs-on: ubuntu-latest
    needs: [check, build, approve]
    if: needs.check.outputs.skip == 'false'
    environment: pypi
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: dist-${{ needs.check.outputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128cdb8466e0ae  # release/v1 (2025-03-07)
      - name: Create GitHub release tag
        run: |
          git tag "v${{ needs.check.outputs.version }}"
          git push origin "v${{ needs.check.outputs.version }}"

  smoke-test:
    name: Install from PyPI + smoke run
    runs-on: ubuntu-latest
    needs: [check, publish]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Wait for PyPI to propagate
        run: sleep 30
      - name: pip install released version
        run: pip install "dadaia-workspace==${{ needs.check.outputs.version }}"
      - name: dadaia --help
        run: dadaia --help
      - name: dadaia init in tmpdir
        run: |
          mkdir -p /tmp/smoke-ws
          dadaia init --workspace /tmp/smoke-ws
          test -f /tmp/smoke-ws/.dadaia/states/spec_contexts.json
