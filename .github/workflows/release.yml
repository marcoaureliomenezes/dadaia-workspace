name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check if version needs releasing
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.check.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: true
      - id: check
        name: Compare pyproject version vs existing tags
        run: |
          pyver=$(grep -E '^version *= *"' pyproject.toml | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "version=$pyver" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$pyver" | grep -q "v$pyver"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$pyver already exists — skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version v$pyver — proceeding with release."
          fi

  unit-fast:
    name: Unit fast (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow" tests/unit -n auto

  contract-coverage:
    name: Contract coverage (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        # -n auto: same long-pole fix as ci.yml (bug test-suite-real-venv-and-ci-longpole).
        run: poetry run pytest -q -m "unit or contract" -n auto --cov=dadaia_workspace --cov-report=term-missing --cov-fail-under=80 tests/unit tests/contract

  integration:
    name: Integration (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest integration
        run: poetry run pytest -q -m integration tests/integration --durations=30

  e2e-python:
    name: E2E Python (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest e2e python
        run: poetry run pytest -q -m e2e tests/e2e/features --durations=30

  e2e-panel:
    name: E2E panel (Playwright)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Node deps
        working-directory: tests/e2e
        run: npm ci
      # Browser cache — see ci.yml e2e-panel for the rationale
      # (bug test-suite-real-venv-and-ci-longpole).
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: tests/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: tests/e2e
        run: npx playwright install-deps chromium
      - name: playwright panel e2e
        working-directory: tests/e2e
        env:
          # See ci.yml's e2e-panel job for the full root-cause note
          # (T-65-14 CI-fix amendment). run-panel-e2e-server.sh bootstraps a
          # hermetic temp workspace itself; the old bootstrap script +
          # hardcoded --port 4999 override are retired.
          PANEL_E2E_PYTHON: poetry run python
          # Pin the hermetic temp workspace (AC-4 spec-context-operation-journey
          # needs a known PANEL_TEST_REGISTRY to run for real, not skip).
          PANEL_E2E_WS: ${{ runner.temp }}/dadaia-panel-e2e-ws
          PANEL_TEST_REGISTRY: ${{ runner.temp }}/dadaia-panel-e2e-ws/.dadaia/states/spec_contexts.json
          # Known artifact path for the failure-evidence upload below
          # (bug panel-e2e-artifacts-no-consumer); CI runs list reporter only.
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/pw-output
        run: npm run test:e2e
      - name: Upload failure evidence (traces + screenshots)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: panel-e2e-failure-evidence
          path: ${{ runner.temp }}/pw-output
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [check, unit-fast, contract-coverage, integration, e2e-python, e2e-panel]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: Build artifacts
        run: poetry build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ needs.check.outputs.version }}
          path: dist/

  approve:
    name: Approve release to PyPI
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.skip == 'false'
    environment: release-gate
    timeout-minutes: 60
    steps:
      - name: Release approved
        run: echo "Release v${{ needs.check.outputs.version }} approved — proceeding to publish."

  publish:
    name: Publish to PyPI (OIDC trusted publishing)
    runs-on: ubuntu-latest
    needs: [check, build, approve]
    if: needs.check.outputs.skip == 'false'
    environment: pypi
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-${{ needs.check.outputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
      - name: Create GitHub release tag
        run: |
          git tag "v${{ needs.check.outputs.version }}"
          git push origin "v${{ needs.check.outputs.version }}"

  smoke-test:
    name: Install from PyPI + smoke run
    runs-on: ubuntu-latest
    needs: [check, publish]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Wait for PyPI to propagate
        run: sleep 30
      - name: pip install released version
        run: pip install "dadaia-workspace==${{ needs.check.outputs.version }}"
      - name: dadaia --help
        run: dadaia --help
      - name: dadaia init in tmpdir
        # Use the runner temp dir (portable; no hardcoded /tmp — T-018-09).
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-ws"
          dadaia init --workspace "$RUNNER_TEMP/smoke-ws"
          test -f "$RUNNER_TEMP/smoke-ws/.dadaia/states/spec_contexts.json"
