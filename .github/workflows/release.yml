name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check if version needs releasing
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.check.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-tags: true
      - id: check
        name: Compare pyproject version vs existing tags
        run: |
          pyver=$(grep -E '^version *= *"' pyproject.toml | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "version=$pyver" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$pyver" | grep -q "v$pyver"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$pyver already exists — skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version v$pyver — proceeding with release."
          fi

  unit-fast:
    name: Unit fast (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow" tests/unit

  contract-coverage:
    name: Contract coverage (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        run: poetry run pytest -q -m "unit or contract" --cov=dadaia_workspace --cov-report=term-missing --cov-fail-under=80 tests/unit tests/contract

  integration:
    name: Integration (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest integration
        run: poetry run pytest -q -m integration tests/integration --durations=30

  e2e-python:
    name: E2E Python (pytest)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest e2e python
        run: poetry run pytest -q -m e2e tests/e2e/features --durations=30

  e2e-panel:
    name: E2E panel (Playwright)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: Bootstrap panel workspace
        run: .github/scripts/bootstrap-panel-ws.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Node deps
        working-directory: tests/e2e
        run: npm ci
      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: playwright panel e2e
        working-directory: tests/e2e
        env:
          PANEL_WEB_SERVER_COMMAND: poetry run python -m dadaia_workspace.cli.main panel --port 4999 --no-open
        run: npm run test:e2e

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [check, unit-fast, contract-coverage, integration, e2e-python, e2e-panel]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: Build artifacts
        run: poetry build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ needs.check.outputs.version }}
          path: dist/

  approve:
    name: Approve release to PyPI
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.skip == 'false'
    environment: release-gate
    timeout-minutes: 60
    steps:
      - name: Release approved
        run: echo "Release v${{ needs.check.outputs.version }} approved — proceeding to publish."

  publish:
    name: Publish to PyPI (OIDC trusted publishing)
    runs-on: ubuntu-latest
    needs: [check, build, approve]
    if: needs.check.outputs.skip == 'false'
    environment: pypi
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-${{ needs.check.outputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
      - name: Create GitHub release tag
        run: |
          git tag "v${{ needs.check.outputs.version }}"
          git push origin "v${{ needs.check.outputs.version }}"

  smoke-test:
    name: Install from PyPI + smoke run
    runs-on: ubuntu-latest
    needs: [check, publish]
    if: needs.check.outputs.skip == 'false'
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Wait for PyPI to propagate
        run: sleep 30
      - name: pip install released version
        run: pip install "dadaia-workspace==${{ needs.check.outputs.version }}"
      - name: dadaia --help
        run: dadaia --help
      - name: dadaia init in tmpdir
        # Use the runner temp dir (portable; no hardcoded /tmp — T-018-09).
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-ws"
          dadaia init --workspace "$RUNNER_TEMP/smoke-ws"
          test -f "$RUNNER_TEMP/smoke-ws/.dadaia/states/spec_contexts.json"
