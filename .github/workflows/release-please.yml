name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    # workflow_dispatch accepts any ref; minting a version from a branch's history
    # is what this guard refuses. The push trigger is already main-only.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      # The release type lives in release-please-config.json: passing release-type
      # here switches the action out of manifest mode and the config is ignored.
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Everything below publishes the release the action just tagged. One boolean —
  # release_created — decides: on an ordinary push to main the action only refreshes
  # the release PR and every job here is skipped (PLAN D8: same-workflow chaining,
  # no PAT, no second trigger).

  unit-fast:
    name: Unit fast (pytest)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow and not quarantine" tests/unit -n auto

  contract-coverage:
    name: Contract coverage (pytest)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        # -n auto: same long-pole fix as ci.yml (bug test-suite-real-venv-and-ci-longpole).
        # COVERAGE_FILE redirect mirrors ci.yml (pyproject data_file removed in
        # T-018-07; bug release-workflow-coverage-file-in-checkout — .coverage
        # must never land in the checkout). Pinned by
        # tests/contract/test_workflow_coverage_redirect.py.
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: poetry run pytest -q -m "(unit or contract) and not quarantine" -n auto --cov=dadaia_workspace --cov-report=term-missing --cov-fail-under=80 tests/unit tests/contract

  integration:
    name: Integration (pytest)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest integration
        run: poetry run pytest -q -m "integration and not quarantine" tests/integration --durations=30

  e2e-python:
    name: E2E Python (pytest)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest e2e python
        run: poetry run pytest -q -m "e2e and not quarantine" tests/e2e/features --durations=30

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [release-please, unit-fast, contract-coverage, integration, e2e-python]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - id: version
        name: Read the version from the tag release-please minted
        # The tag travels through env: a workflow expression inside a run body is the
        # template-injection shape. This is the ONE place the version is derived.
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction --no-ansi --with dev
      - name: Build artifacts
        run: poetry build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/

  approve:
    name: Approve release to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    environment: release-gate
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Release approved
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: echo "Release v$VERSION approved — proceeding to publish."

  publish:
    name: Publish to PyPI (OIDC trusted publishing)
    runs-on: ubuntu-latest
    needs: [release-please, build, approve]
    if: needs.release-please.outputs.release_created == 'true'
    environment: pypi
    # The tag already exists — release-please minted it — so this job never writes
    # to the repository; it only exchanges the OIDC token for a PyPI upload.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0

  smoke-test:
    name: Install from PyPI + smoke run
    runs-on: ubuntu-latest
    needs: [release-please, build, publish]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Wait for the published version to appear on PyPI
        # A fixed sleep is a guess in both directions: too short and the install below
        # fails on a release that was fine, too long and every release pays for the
        # worst case. Poll the index for the exact version instead, and say which one
        # never arrived.
        run: |
          for _ in $(seq 1 10); do
            if pip download --no-deps --no-cache-dir \
                "dadaia-workspace==$VERSION" -d "$RUNNER_TEMP/pypi-probe"; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::dadaia-workspace==$VERSION did not appear on PyPI within 5 minutes."
          exit 1
      - name: pip install released version
        run: pip install "dadaia-workspace==$VERSION"
      - name: dadaia --help
        run: dadaia --help
      - name: dadaia init in tmpdir
        # Use the runner temp dir (portable; no hardcoded /tmp — T-018-09).
        # The directory is init's one positional argument and --harness its one required
        # option; `--workspace` and the implied full harness set are retired.
        run: |
          dadaia init "$RUNNER_TEMP/smoke-ws" --harness claude
          test -f "$RUNNER_TEMP/smoke-ws/.dadaia/states/spec_contexts.json"

  publish-skills-repo:
    name: Publish the dadaia-skills repository
    runs-on: ubuntu-latest
    needs: [release-please, build, publish]
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 5
    # contents: read — the push targets the OTHER repository
    # (marcoaureliomenezes/dadaia-skills) through SKILLS_REPO_TOKEN, never this one.
    permissions:
      contents: read
    env:
      SKILLS_REPO_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: "Secret missing: fail closed (operator adds SKILLS_REPO_TOKEN)"
        if: env.SKILLS_REPO_TOKEN == ''
        run: |
          echo "::error::SKILLS_REPO_TOKEN is not set; the skills repository cannot be published and this job fails closed. Add the secret (contents:write on marcoaureliomenezes/dadaia-skills)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the skills repository
        run: python dadaia_workspace/public/scripts/build-skills-repo.py "$RUNNER_TEMP/skills-repo"
      - name: Push the built tree to marcoaureliomenezes/dadaia-skills
        # The generated out-dir is not this repository, so `git add -A` there is safe.
        # The published repository is a build output whose history is this repository's
        # tags: every release force-pushes the freshly rendered tree over main.
        run: |
          cd "$RUNNER_TEMP/skills-repo"
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "dadaia-skills $VERSION"
          git push --force "https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/marcoaureliomenezes/dadaia-skills.git" main
