name: Secret Scan (gitleaks)

on:
  push:
    branches:
      - main
      - 'hotfix/v*'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action ScanPullRequest lists GET /pulls/<n>/commits

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # full history scan, not just tip
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments disabled: posting PR review comments needs `pull-requests: write`,
          # but this job intentionally runs least-privilege (`contents: read`). With
          # comments off the action still scans full history and fails on any finding;
          # GitGuardian provides the annotated-PR view. Fixes 403 "Resource not
          # accessible by integration" on ScanPullRequest.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
