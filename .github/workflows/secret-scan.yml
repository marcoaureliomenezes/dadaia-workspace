name: Secret Scan (gitleaks)

on:
  push:
    branches:
      - main
      - 'hotfix/v*'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action ScanPullRequest lists GET /pulls/<n>/commits

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history scan, not just tip
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments disabled: posting PR review comments needs `pull-requests: write`,
          # but this job intentionally runs least-privilege (`contents: read`). With
          # comments off the action still scans full history and fails on any finding;
          # GitGuardian provides the annotated-PR view. Fixes 403 "Resource not
          # accessible by integration" on ScanPullRequest.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
