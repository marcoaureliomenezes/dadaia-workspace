name: CI

on:
  push:
    branches:
      - main
      - 'hotfix/v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Optional: supply sidecar paths when invoking from a CLOSURE workflow.
    # Leave blank on regular manual runs — the gate auto-discovers or no-ops.
    inputs:
      qa_sidecar:
        description: "Path to qa-engineer handoff sidecar (*.handoff.json). Optional."
        required: false
        default: ""
      security_sidecar:
        description: "Path to security-reviewer handoff sidecar (*.handoff.json). Optional."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.3
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dev deps
        run: poetry install --no-interaction --no-ansi --with dev
      - name: ruff format --check
        run: poetry run ruff format --check dadaia_workspace/ tests/
      - name: ruff check
        run: poetry run ruff check dadaia_workspace/ tests/

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.3
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: mypy --strict
        run: poetry run mypy --strict dadaia_workspace/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.3
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest
        run: poetry run pytest -q

  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci|perf|revert)(\([^)]+\))?(!)?: .+'; then
            echo "::error::PR title must follow Conventional Commits, got: $PR_TITLE"
            exit 1
          fi

  repo-hygiene:
    name: Repo hygiene (no tracked projection files)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Fail if projection or runtime files are git-tracked
        run: |
          FOUND=$(git ls-files | grep -E '^\.(claude|agents|codex|opencode)/|^\.dadaia/(agentic|scripts|states|reports)/' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Tracked projection/runtime files detected. Remove them from the git index:"
            echo "$FOUND"
            exit 1
          fi
          echo "No tracked projection files found."

  hotfix-branch-name:
    name: Hotfix branch SemVer (PATCH>=1)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')
    timeout-minutes: 1
    steps:
      - name: Validate hotfix branch name
        env:
          REF: ${{ github.ref }}
        run: |
          BRANCH="${REF#refs/heads/}"
          # Required: hotfix/v<MAJOR>.<MINOR>.<PATCH>[-<slug>]  where PATCH >= 1
          if ! echo "$BRANCH" | grep -Eq '^hotfix/v[0-9]+\.[0-9]+\.[1-9][0-9]*(-[a-z0-9._-]+)?$'; then
            echo "::error::Hotfix branch must be hotfix/v<M>.<m>.<p> with PATCH>=1 (optional -slug). Got: $BRANCH"
            echo "::error::Examples accepted: hotfix/v1.0.1, hotfix/v0.2.3-fix-auth-crash"
            echo "::error::Examples rejected: hotfix/v1.0 (no patch), hotfix/v1.0.0 (patch=0 reserved for feature releases), hotfix/v1.0.0-beta (pre-release tag)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Dual-approval verdict gate (panel-kanban-v1 §3 K-3 / §9)
  # ---------------------------------------------------------------------------
  # Behaviour:
  #   - Normal CI runs (push / PR): .dadaia/reports/ is gitignored, no sidecars
  #     are present in the checkout → check-verdict.sh exits 0 (no-op).
  #   - Release CLOSURE: operator triggers `workflow_dispatch` supplying
  #     qa_sidecar and security_sidecar inputs, OR places handoff sidecar files
  #     inside the checkout (e.g. via upload-artifact / download-artifact in a
  #     wrapping workflow). The script then asserts both verdicts == "APPROVED".
  #   - ubuntu-latest ships with jq preinstalled; no extra setup needed.
  verdict-gate:
    name: Dual-approval verdict gate (qa + security)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Check qa-engineer + security-reviewer verdicts
        env:
          # Passed via workflow_dispatch inputs; empty on push/PR runs.
          QA_SIDECAR: ${{ github.event.inputs.qa_sidecar || '' }}
          SECURITY_SIDECAR: ${{ github.event.inputs.security_sidecar || '' }}
        run: bash scripts/check-verdict.sh
