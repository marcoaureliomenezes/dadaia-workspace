name: CI

# Gitflow law v2 (v0.4.4 FR3/FR4 / DADAIA.md §4 (Gitflow)): feature/{M.m.p} is the ONLY pushable
# branch (its push triggers the full matrix below); develop and main advance by PR
# only. Every PR is gated by pr-source-guard (both edges, one job) and by
# security-review (the official anthropics/claude-code-security-review Action over the
# PR diff — 0.4.7 c5 FR5). hotfix/* was retired outright (G2) and carries no trigger.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI matrix (T-018-09 / WS-2): cross-platform importability smoke.
  # Windows + macOS ONLY (ubuntu is already covered by the hard-gating jobs below).
  # GRADUATED to a hard gate in 0.1.8 rc-2 (F-01 fcntl crash fixed; green on both OSes).
  importability-smoke:
    name: Importability smoke (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Import package + CLI module
        run: python -c "import dadaia_workspace; import dadaia_workspace.cli.main; print('import OK')"
      - name: dadaia --help
        run: dadaia --help

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dev deps
        run: poetry install --no-interaction --no-ansi --with dev
      - name: ruff format --check
        run: poetry run ruff format --check dadaia_workspace/ tests/
      - name: ruff check
        # Redirect ruff's cache outside the checkout (pyproject cache-dir removed in T-018-07).
        run: RUFF_CACHE_DIR="$RUNNER_TEMP/ruff" poetry run ruff check dadaia_workspace/ tests/
      - name: lint-imports (import-boundary contracts)
        # Enforce the setup.cfg import-linter contracts (FR4). --no-cache keeps
        # .import_linter_cache/ out of the checkout (repo-cleanliness law). No extra
        # install: import-linter is provided by the `poetry install --with dev` above.
        run: poetry run lint-imports --config setup.cfg --no-cache

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: mypy --strict
        # Redirect mypy's cache outside the checkout (pyproject cache_dir removed in T-018-07).
        # 0.4.7 FR3: the cache is redirected by [tool.mypy] cache_dir in pyproject.toml.
        run: poetry run mypy --strict dadaia_workspace/

  unit-fast:
    name: Unit fast (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow and not quarantine" tests/unit -n auto --durations=25

  contract-coverage:
    name: Contract coverage (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        # Redirect coverage's data file outside the checkout (pyproject data_file removed in T-018-07).
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        # -n auto: this was the only pytest job without xdist and the CI long pole
        # (bug test-suite-real-venv-and-ci-longpole); pytest-cov combines per-worker
        # coverage automatically.
        run: poetry run pytest -q -m "(unit or contract) and not quarantine" -n auto --cov=dadaia_workspace --cov-report=term-missing --cov-fail-under=80 tests/unit tests/contract --durations=25

  # CI matrix (T-018-21 / WS-2 → GRADUATED in 0.1.8 rc-2): unit + contract on Windows/macOS.
  # Ubuntu hard-gating jobs above remain separate companion jobs so the original required
  # status-check names stay intact. These legs are now hard gates (green on both OSes on the
  # feature/0.1.8 graduation run recorded in CLOSURE) — no continue-on-error.
  unit-fast-cross:
    name: Unit fast (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow and not quarantine" tests/unit -n auto --durations=25

  contract-coverage-cross:
    name: Contract coverage (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        # -n auto: same long-pole fix as the ubuntu contract-coverage job (windows was 2:55).
        run: poetry run pytest -q -m "(unit or contract) and not quarantine" -n auto --cov=dadaia_workspace --cov-report=term-missing tests/unit tests/contract --durations=25

  integration:
    name: Integration (pytest)
    runs-on: ubuntu-latest
    # v0.7.0 P6 ratchet: ~1.5x measured job wall; raising this needs a CLOSURE justification.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest integration
        run: poetry run pytest -q -m "integration and not quarantine" tests/integration --durations=30

  e2e-python:
    name: E2E Python (pytest)
    runs-on: ubuntu-latest
    # v0.7.0 P6 ratchet: ~1.5x measured job wall; raising this needs a CLOSURE justification.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      # The whole e2e tree, not `tests/e2e/features` alone: the journeys at the tree root
      # (the push chokepoint, the denylist, and the one-line bootstrap through the
      # installed console script) were outside every selector and ran nowhere in CI.
      - name: pytest e2e python
        run: poetry run pytest -q -m "e2e and not quarantine" tests/e2e --durations=30

  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci|perf|revert)(\([^)]+\))?(!)?: .+'; then
            echo "::error::PR title must follow Conventional Commits, got: $PR_TITLE"
            exit 1
          fi

  repo-hygiene:
    name: Repo hygiene (no tracked projection files)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fail if projection or runtime files are git-tracked
        run: bash .github/scripts/check_no_repo_local_claude.sh

  doctor:
    name: Compliance (workspace/specs/ledgers sections)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Full history: SPEC-DOC-044's liveness set is the head, its parents and each
        # merged line's first parent (features.chokepoints.verdict.live_verdict_shas);
        # a depth-1 checkout hides a merge commit's parents and calls the verdict the
        # merge just consumed stale — the same reason the verdict-gate job fetches depth 0.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      # Runs the ONE doctor over the checked-out tree (0.4.7 FR5; was `backlog doctor`,
      # v0.1.25 R1/ADR-D). Its `ledgers` section carries BL-SCHEMA/CONFLICT/STALE and its
      # `specs` section the SPEC-DOC + RELEASE-TREE rules over committed repository truth;
      # any error-class finding fails the job. An absent document is trivially clean.
      - name: dadaia doctor
        run: dadaia doctor --specs-dir specs --source-root .

  pr-source-guard:
    name: PR source guard (both gitflow v2 edges, one job)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')
    timeout-minutes: 1
    steps:
      - name: Refuse a PR whose head does not match its base's permitted source
        env:
          # head.ref/base_ref are fork-influenceable input: never interpolate them
          # into the shell command string — read from the environment and compare.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            # Rule 1 (unchanged): main accepts a PR only from develop.
            if [ "$HEAD_REF" != "develop" ]; then
              echo "::error::Gitflow law (DADAIA.md §4 (Gitflow)): main accepts PRs from 'develop' only. Got head '$HEAD_REF'."
              echo "::error::Fix: merge your branch into develop, push develop, and open the PR develop -> main."
              exit 1
            fi
            echo "PR head is develop - gitflow source rule satisfied (main)."
          elif [ "$BASE_REF" = "develop" ]; then
            # Rule 2 (v0.4.4 FR4): develop accepts a PR only from feature/{M.m.p} — no
            # 'v' prefix, M.m.p numeric. Derived from the SAME pattern as
            # features/chokepoints/service.py::_FEATURE_RE
            # (r"^feature/\d+\.\d+\.\d+$") — the ONE pattern source (A3.2); POSIX ERE
            # has no \d, so [0-9]+ is its exact translation, never a second, drifted
            # regex literal.
            if ! echo "$HEAD_REF" | grep -Eq '^feature/[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Gitflow law (DADAIA.md §4 (Gitflow)): develop accepts PRs from 'feature/{M.m.p}' only (no 'v' prefix). Got head '$HEAD_REF'."
              echo "::error::Fix: rebuild your work on a feature/M.m.p branch and open the PR feature/M.m.p -> develop."
              exit 1
            fi
            echo "PR head matches feature/M.m.p - gitflow source rule satisfied (develop)."
          fi

  # ---------------------------------------------------------------------------------
  # Security review (0.4.7 c5 FR5, ADR 0016): the official Anthropic Action reviews the
  # PR diff and reports a status check on the PR head. Required on develop and main by
  # the branch ruleset (operator-owned, together with the CLAUDE_API_KEY secret). With
  # the secret absent the job fails closed: a green check always means a review ran. The
  # sha-keyed verdict file, its two-hop rule and the verdict-gate jobs are gone.
  security-review:
    name: Security review (anthropics/claude-code-security-review)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
    permissions:
      contents: read
      pull-requests: write
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: "Secret missing: fail closed (operator adds CLAUDE_API_KEY, then requires this check)"
        if: env.CLAUDE_API_KEY == ''
        run: |
          echo "::error::CLAUDE_API_KEY is not set; the security review cannot run and this check fails closed. Add the secret, then require this check in the branch ruleset."
          exit 1
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda  # main 2026-02-11
        if: env.CLAUDE_API_KEY != ''
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
