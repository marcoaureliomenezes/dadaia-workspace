name: CI

on:
  push:
    branches:
      - main
      - 'hotfix/v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Optional: supply sidecar paths when invoking from a CLOSURE workflow.
    # Leave blank on regular manual runs — the gate auto-discovers or no-ops.
    inputs:
      qa_sidecar:
        description: "Path to qa-engineer handoff sidecar (*.handoff.json). Optional."
        required: false
        default: ""
      security_sidecar:
        description: "Path to security-reviewer handoff sidecar (*.handoff.json). Optional."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dev deps
        run: poetry install --no-interaction --no-ansi --with dev
      - name: ruff format --check
        run: poetry run ruff format --check dadaia_workspace/ tests/
      - name: ruff check
        run: poetry run ruff check dadaia_workspace/ tests/

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: mypy --strict
        run: poetry run mypy --strict dadaia_workspace/

  unit-fast:
    name: Unit fast (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow" tests/unit

  contract-coverage:
    name: Contract coverage (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        run: poetry run pytest -q -m "unit or contract" --cov=dadaia_workspace --cov-report=term-missing --cov-fail-under=80 tests/unit tests/contract

  integration:
    name: Integration (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest integration
        run: poetry run pytest -q -m integration tests/integration --durations=30

  e2e-python:
    name: E2E Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest e2e python
        run: poetry run pytest -q -m e2e tests/e2e/features --durations=30

  e2e-panel:
    name: E2E panel (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install Python deps
        run: poetry install --no-interaction --no-ansi --with dev
      - name: Bootstrap panel workspace
        run: |
          poetry run python -m dadaia_workspace.cli.main init --workspace "$PWD" --skip-assets
          poetry run python -m dadaia_workspace.cli.main public stage
          mkdir -p repos
          ln -sfn "$PWD" repos/dadaia-workspace
          cat > .dadaia/states/spec_contexts.json <<JSON
          {
            "schema_version": "2",
            "contexts": [
              {
                "name": "dadaia-workspace",
                "state": "alive",
                "repo_slug": "dadaia-workspace",
                "repo_url": "https://github.com/marcoaureliomenezes/dadaia-workspace.git",
                "created_at": "2026-06-03T00:00:00+00:00",
                "alive_since": "2026-06-03T00:00:00+00:00",
                "dead_since": null,
                "current_branch": "main"
              }
            ]
          }
          JSON
          cat > .dadaia/states/primary_context.json <<JSON
          {
            "name": "dadaia-workspace",
            "repo_slug": "dadaia-workspace",
            "specs_dir": "$PWD/specs"
          }
          JSON
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Node deps
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: playwright panel e2e
        env:
          PANEL_WEB_SERVER_COMMAND: poetry run python -m dadaia_workspace.cli.main panel --port 4999 --no-open
        run: npm run test:e2e

  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci|perf|revert)(\([^)]+\))?(!)?: .+'; then
            echo "::error::PR title must follow Conventional Commits, got: $PR_TITLE"
            exit 1
          fi

  repo-hygiene:
    name: Repo hygiene (no tracked projection files)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Fail if projection or runtime files are git-tracked
        run: bash scripts/check_no_repo_local_claude.sh

  hotfix-branch-name:
    name: Hotfix branch SemVer (PATCH>=1)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')
    timeout-minutes: 1
    steps:
      - name: Validate hotfix branch name
        env:
          REF: ${{ github.ref }}
        run: |
          BRANCH="${REF#refs/heads/}"
          # Required: hotfix/v<MAJOR>.<MINOR>.<PATCH>[-<slug>]  where PATCH >= 1
          if ! echo "$BRANCH" | grep -Eq '^hotfix/v[0-9]+\.[0-9]+\.[1-9][0-9]*(-[a-z0-9._-]+)?$'; then
            echo "::error::Hotfix branch must be hotfix/v<M>.<m>.<p> with PATCH>=1 (optional -slug). Got: $BRANCH"
            echo "::error::Examples accepted: hotfix/v1.0.1, hotfix/v0.2.3-fix-auth-crash"
            echo "::error::Examples rejected: hotfix/v1.0 (no patch), hotfix/v1.0.0 (patch=0 reserved for feature releases), hotfix/v1.0.0-beta (pre-release tag)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Dual-approval verdict gate (panel-kanban-v1 §3 K-3 / §9)
  # ---------------------------------------------------------------------------
  # Behaviour:
  #   - Normal CI runs (push / PR): .dadaia/reports/ is gitignored, no sidecars
  #     are present in the checkout → check-verdict.sh exits 0 (no-op).
  #   - Release CLOSURE: operator triggers `workflow_dispatch` supplying
  #     qa_sidecar and security_sidecar inputs, OR places handoff sidecar files
  #     inside the checkout (e.g. via upload-artifact / download-artifact in a
  #     wrapping workflow). The script then asserts both verdicts == "APPROVED".
  #   - ubuntu-latest ships with jq preinstalled; no extra setup needed.
  verdict-gate:
    name: Dual-approval verdict gate (qa + security)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Check qa-engineer + security-reviewer verdicts
        env:
          # Passed via workflow_dispatch inputs; empty on push/PR runs.
          QA_SIDECAR: ${{ github.event.inputs.qa_sidecar || '' }}
          SECURITY_SIDECAR: ${{ github.event.inputs.security_sidecar || '' }}
        run: bash scripts/check-verdict.sh
