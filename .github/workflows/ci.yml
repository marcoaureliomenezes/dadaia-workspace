name: CI

# Gitflow by role (specs/constitution.md `gitflow:`): the work branch and a job branch
# `wt/<M.m.p>-rc<N>/<job>` are the ONLY pushable branches (a push triggers the full matrix
# below); the integration and principal branches advance by PR only. The triggers below are
# literal (GitHub reads no file) and pinned to the library gitflow by the ci-triggers-gitflow
# guard; pr-source-guard reads the gitflow itself. No job calls a model API — the security review is the local
# dd-code-reviewer lens.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      # a job branch (ADR 0190): its push runs the matrix the job's verdict names
      - 'wt/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # release.yml reuses this one check set before it publishes (ADR 0078).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI matrix (T-018-09 / WS-2): cross-platform importability smoke.
  # Windows + macOS ONLY (ubuntu is already covered by the hard-gating jobs below).
  # GRADUATED to a hard gate in 0.1.8 rc-2 (F-01 fcntl crash fixed; green on both OSes).
  importability-smoke:
    name: Importability smoke (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Import package + CLI module
        run: python -c "import dadaia_workspace; import dadaia_workspace.cli.main; print('import OK')"
      - name: dadaia --help
        run: dadaia --help

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dev deps
        run: poetry install --no-interaction --no-ansi --with dev
      # Every Linux job's commands live in scripts/ci.py, the one source (T-050-190).
      - name: lint
        run: poetry run python scripts/ci.py lint

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: typecheck
        run: poetry run python scripts/ci.py typecheck

  guards:
    name: Guards (scripts/guards)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: guards
        run: poetry run python scripts/ci.py guards

  unit-fast:
    name: Unit fast (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: unit-fast
        run: poetry run python scripts/ci.py unit-fast

  contract-coverage:
    name: Contract coverage (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: contract-coverage
        run: poetry run python scripts/ci.py contract-coverage

  # CI matrix (T-018-21 / WS-2 → GRADUATED in 0.1.8 rc-2): unit + contract on Windows/macOS.
  # Ubuntu hard-gating jobs above remain separate companion jobs so the original required
  # status-check names stay intact. These legs are now hard gates (green on both OSes on the
  # feature/0.1.8 graduation run recorded in CLOSURE) — no continue-on-error.
  unit-fast-cross:
    name: Unit fast (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        shell: bash
        env:
          SELECT: ${{ matrix.os == 'windows-latest' && 'small or windows' || 'not e2e' }}
        run: poetry run pytest -q -m "($SELECT) and not slow and not quarantine" tests -n auto --durations=25

  contract-coverage-cross:
    name: Contract coverage (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      # Poetry's editable builder writes no Scripts\dadaia.exe on Windows; pip's PEP 660 install does.
      - name: Install the dadaia launcher
        run: poetry run python -m pip install --no-deps -e .
      - name: pytest small and medium coverage
        shell: bash
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          SELECT: ${{ matrix.os == 'windows-latest' && 'small or windows' || 'not e2e' }}
        # -n auto: same long-pole fix as the ubuntu contract-coverage job (windows was 2:55).
        run: poetry run pytest -q -m "($SELECT) and not quarantine" -n auto --cov=dadaia_workspace --cov-report=term-missing tests --durations=25
      - name: the windows-integration-coverage-gap cases
        shell: bash
        run: poetry run pytest -q -m "windows and not quarantine" -v tests

  integration:
    name: Integration (pytest)
    runs-on: ubuntu-latest
    # v0.7.0 P6 ratchet: ~1.5x measured job wall; raising this needs a CLOSURE justification.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: integration
        run: poetry run python scripts/ci.py integration

  e2e-python:
    name: E2E Python (pytest)
    runs-on: ubuntu-latest
    # v0.7.0 P6 ratchet: ~1.5x measured job wall; raising this needs a CLOSURE justification.
    # 0.4.8 T-048-11: 6 -> 12 — the onboarding journey (uvx + real workspace venvs, ~2 min
    # local) now runs here instead of skipping.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      # The onboarding journey drives `uvx --from <wheel>` (AC8.3).
      - name: Install uv
        run: pipx install uv==0.11.16
      - name: e2e-python
        run: poetry run python scripts/ci.py e2e-python

  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci|perf|revert)(\([^)]+\))?(!)?: .+'; then
            echo "::error::PR title must follow Conventional Commits, got: $PR_TITLE"
            exit 1
          fi

  repo-hygiene:
    name: Repo hygiene (no tracked projection files)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: repo-hygiene
        run: python3 scripts/ci.py repo-hygiene

  doctor:
    name: Compliance (workspace/specs/ledgers sections)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the CLOSURE memory-window check (RELEASE-TREE / LEDGER-RELEASE-SCHEMA)
      # diffs the memory entry's since..until and until..HEAD; a shallow clone lacks them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      # Runs the ONE doctor over the checked-out tree (0.4.7 FR5; was `backlog doctor`,
      # v0.1.25 R1/ADR-D). Its `ledgers` section carries BL-SCHEMA/CONFLICT/STALE and its
      # `specs` section the SPEC-DOC + RELEASE-TREE rules over committed repository truth;
      # any error-class finding fails the job. An absent document is trivially clean.
      - name: doctor
        run: python scripts/ci.py doctor

  pr-source-guard:
    name: PR source guard (both gitflow edges, one job)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      # The PR's code evaluates the BASE branch's gitflow data: the roles that admit a PR
      # come from the constitution it merges into, never from the PR itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Read the base branch's constitution
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SPECS: ${{ runner.temp }}/base-specs
        run: |
          python -m pip install --quiet pyyaml==6.0.3
          mkdir -p "$BASE_SPECS"
          git fetch --quiet --depth=1 origin "refs/heads/$BASE_REF"
          # Absent file: read_gitflow falls back to the default gitflow and warns.
          git show "FETCH_HEAD:specs/constitution.md" > "$BASE_SPECS/constitution.md" || rm -f "$BASE_SPECS/constitution.md"
      - name: Refuse a PR whose head does not match its base's permitted source
        env:
          # head.ref/base_ref are fork-influenceable input: never interpolate them
          # into the shell command string — read from the environment and compare.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SPECS: ${{ runner.temp }}/base-specs
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          from dadaia_workspace.core.gitflow import read_gitflow

          flow, warning = read_gitflow(Path(os.environ["BASE_SPECS"]))
          if warning:
              print(f"::warning::{warning}")
          head, base = os.environ["HEAD_REF"], os.environ["BASE_REF"]
          if base == flow.principal:
              # ADR 0021: the principal accepts the integration branch's promote PR and
              # release-please's release PR, nothing else.
              ok = head in (flow.integration, f"release-please--branches--{flow.principal}")
              want = f"'{flow.integration}' or the release-please release PR"
          elif base == flow.integration:
              # Dependabot targets the integration branch (dependabot.yml).
              ok = flow.role_of(head) == "work" or head.startswith("dependabot/")
              want = f"'{flow.work_prefix}<M.m.p>' or a Dependabot update branch"
          else:
              ok, want = True, ""
          if not ok:
              print(f"::error::Gitflow law: {base} accepts PRs from {want} only. Got head '{head}'.")
              sys.exit(1)
          print(f"PR head {head} - gitflow source rule satisfied ({base}).")
          PY
