name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'hotfix/v*'
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Optional: supply handoff paths when invoking from a CLOSURE workflow.
    # Leave blank on regular manual runs — the gate auto-discovers or no-ops.
    inputs:
      qa_sidecar:
        description: "Path to qa-engineer handoff (*.handoff.json). Optional."
        required: false
        default: ""
      security_sidecar:
        description: "Path to security-reviewer handoff (*.handoff.json). Optional."
        required: false
        default: ""
      release_id:
        description: "Release id expected in qa/security handoffs when supplied."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI matrix (T-018-09 / WS-2): cross-platform importability smoke.
  # Windows + macOS ONLY (ubuntu is already covered by the hard-gating jobs below).
  # GRADUATED to a hard gate in 0.1.8 rc-2 (F-01 fcntl crash fixed; green on both OSes).
  importability-smoke:
    name: Importability smoke (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Import package + CLI module
        run: python -c "import dadaia_workspace; import dadaia_workspace.cli.main; print('import OK')"
      - name: dadaia --help
        run: dadaia --help

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dev deps
        run: poetry install --no-interaction --no-ansi --with dev
      - name: ruff format --check
        run: poetry run ruff format --check dadaia_workspace/ tests/
      - name: ruff check
        # Redirect ruff's cache outside the checkout (pyproject cache-dir removed in T-018-07).
        run: RUFF_CACHE_DIR="$RUNNER_TEMP/ruff" poetry run ruff check dadaia_workspace/ tests/
      - name: lint-imports (import-boundary contracts)
        # Enforce the setup.cfg import-linter contracts (FR4). --no-cache keeps
        # .import_linter_cache/ out of the checkout (repo-cleanliness law). No extra
        # install: import-linter is provided by the `poetry install --with dev` above.
        run: poetry run lint-imports --config setup.cfg --no-cache

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: mypy --strict
        # Redirect mypy's cache outside the checkout (pyproject cache_dir removed in T-018-07).
        run: MYPY_CACHE_DIR="$RUNNER_TEMP/mypy" poetry run mypy --strict dadaia_workspace/

  unit-fast:
    name: Unit fast (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow" tests/unit -n auto

  contract-coverage:
    name: Contract coverage (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        # Redirect coverage's data file outside the checkout (pyproject data_file removed in T-018-07).
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        # -n auto: this was the only pytest job without xdist and the CI long pole
        # (bug test-suite-real-venv-and-ci-longpole); pytest-cov combines per-worker
        # coverage automatically.
        run: poetry run pytest -q -m "unit or contract" -n auto --cov=dadaia_workspace --cov-report=term-missing --cov-fail-under=80 tests/unit tests/contract

  # CI matrix (T-018-21 / WS-2 → GRADUATED in 0.1.8 rc-2): unit + contract on Windows/macOS.
  # Ubuntu hard-gating jobs above remain separate companion jobs so the original required
  # status-check names stay intact. These legs are now hard gates (green on both OSes on the
  # feature/0.1.8 graduation run recorded in CLOSURE) — no continue-on-error.
  unit-fast-cross:
    name: Unit fast (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit fast
        run: poetry run pytest -q -m "unit and not slow" tests/unit -n auto

  contract-coverage-cross:
    name: Contract coverage (Windows/macOS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest unit/contract coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        # -n auto: same long-pole fix as the ubuntu contract-coverage job (windows was 2:55).
        run: poetry run pytest -q -m "unit or contract" -n auto --cov=dadaia_workspace --cov-report=term-missing tests/unit tests/contract

  integration:
    name: Integration (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest integration
        run: poetry run pytest -q -m integration tests/integration --durations=30

  e2e-python:
    name: E2E Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest e2e python
        run: poetry run pytest -q -m e2e tests/e2e/features --durations=30

  e2e-panel:
    name: E2E panel (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install Python deps
        run: poetry install --no-interaction --no-ansi --with dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Node deps
        working-directory: tests/e2e
        run: npm ci
      # Cache the browser download (~/.cache/ms-playwright) keyed on the resolved
      # @playwright/test version — the browser build only changes when the package
      # does (bug test-suite-real-venv-and-ci-longpole: Chromium was re-downloaded
      # every run). On a hit only the apt system deps still install.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: tests/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: tests/e2e
        run: npx playwright install-deps chromium
      - name: playwright panel e2e
        working-directory: tests/e2e
        env:
          # tests/e2e/panel/run-panel-e2e-server.sh (playwright.config.ts's
          # default webServer command) bootstraps a hermetic temp workspace
          # itself — the old "Bootstrap panel workspace" step + hardcoded
          # --port 4999 override are retired (T-65-14 CI-fix amendment: the
          # old bootstrap wrote spec_contexts.json directly at the checkout
          # root, making workspace_root == the source repo root, which the
          # `_is_source_repo_root` production guard correctly refused on the
          # agent-policy Apply PUT's re-render).
          PANEL_E2E_PYTHON: poetry run python
          # Pin the hermetic temp workspace to a known path (instead of a
          # fresh mktemp) so spec-context-operation-journey.spec.ts (AC-4)
          # can point PANEL_TEST_REGISTRY at its spec_contexts.json and run
          # for real in CI, rather than deterministically skipping.
          PANEL_E2E_WS: ${{ runner.temp }}/dadaia-panel-e2e-ws
          PANEL_TEST_REGISTRY: ${{ runner.temp }}/dadaia-panel-e2e-ws/.dadaia/states/spec_contexts.json
          # Known artifact path so the failure-evidence upload below can find it
          # (bug panel-e2e-artifacts-no-consumer: evidence used to land in an
          # anonymous tmpdir and was discarded even on failure). In CI the
          # config runs the list reporter only — failure evidence is the
          # only-on-failure screenshots + first-retry traces in this dir.
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/pw-output
        run: npm run test:e2e
      - name: Upload failure evidence (traces + screenshots)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: panel-e2e-failure-evidence
          path: ${{ runner.temp }}/pw-output
          retention-days: 7
          if-no-files-found: ignore

  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci|perf|revert)(\([^)]+\))?(!)?: .+'; then
            echo "::error::PR title must follow Conventional Commits, got: $PR_TITLE"
            exit 1
          fi

  repo-hygiene:
    name: Repo hygiene (no tracked projection files)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fail if projection or runtime files are git-tracked
        run: bash .github/scripts/check_no_repo_local_claude.sh

  backlog-doctor:
    name: Backlog consistency (BL-SCHEMA/DUP/CONFLICT/STALE)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      # Runs backlog doctor over the checked-out tree (v0.1.25 R1, ADR-D). A clean backlog
      # exits 0; a planted BL-SCHEMA/DUP/CONFLICT/STALE violation fails the job. specs/backlog/
      # is gitignored in this source repo, so the check runs over whatever survivors are
      # tracked — an empty backlog is trivially clean.
      - name: dadaia backlog doctor
        run: dadaia backlog doctor --specs-dir specs --source-root .

  hotfix-branch-name:
    name: Hotfix branch SemVer (PATCH>=1)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')
    timeout-minutes: 1
    steps:
      - name: Validate hotfix branch name
        env:
          REF: ${{ github.ref }}
        run: |
          BRANCH="${REF#refs/heads/}"
          # Required: hotfix/v<MAJOR>.<MINOR>.<PATCH>[-<slug>]  where PATCH >= 1
          if ! echo "$BRANCH" | grep -Eq '^hotfix/v[0-9]+\.[0-9]+\.[1-9][0-9]*(-[a-z0-9._-]+)?$'; then
            echo "::error::Hotfix branch must be hotfix/v<M>.<m>.<p> with PATCH>=1 (optional -slug). Got: $BRANCH"
            echo "::error::Examples accepted: hotfix/v1.0.1, hotfix/v0.2.3-fix-auth-crash"
            echo "::error::Examples rejected: hotfix/v1.0 (no patch), hotfix/v1.0.0 (patch=0 reserved for feature releases), hotfix/v1.0.0-beta (pre-release tag)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Dual-approval verdict gate (panel-kanban-v1 §3 K-3 / §9)
  # ---------------------------------------------------------------------------
  # Behaviour:
  #   - Normal CI runs (push / PR): .dadaia/handoff/ is gitignored, no handoffs
  #     are present in the checkout → check-verdict.sh exits 0 (no-op).
  #   - Release CLOSURE: operator triggers `workflow_dispatch` supplying
  #     qa_sidecar and security_sidecar inputs, OR places handoff files
  #     inside the checkout (e.g. via upload-artifact / download-artifact in a
  #     wrapping workflow). The script then asserts both verdicts == "APPROVED".
  #   - ubuntu-latest ships with jq preinstalled; no extra setup needed.
  verdict-gate:
    name: Dual-approval verdict gate (qa + security)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check qa-engineer + security-reviewer verdicts
        env:
          # Passed via workflow_dispatch inputs; empty on push/PR runs.
          QA_HANDOFF: ${{ github.event.inputs.qa_sidecar || '' }}
          SECURITY_HANDOFF: ${{ github.event.inputs.security_sidecar || '' }}
          RELEASE_ID: ${{ github.event.inputs.release_id || '' }}
        run: bash .github/scripts/check-verdict.sh
