name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dev deps
        run: poetry install --no-interaction --no-ansi --with dev
      - name: ruff format --check
        run: poetry run ruff format --check dadaia_workspace/ tests/
      - name: ruff check
        run: poetry run ruff check dadaia_workspace/ tests/

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: mypy --strict
        run: poetry run mypy --strict dadaia_workspace/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache poetry deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install
        run: poetry install --no-interaction --no-ansi --with dev
      - name: pytest
        run: poetry run pytest -q

  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci|perf|revert)(\([^)]+\))?(!)?: .+'; then
            echo "::error::PR title must follow Conventional Commits, got: $PR_TITLE"
            exit 1
          fi
