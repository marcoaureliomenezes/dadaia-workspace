version: 2
updates:
  # Python dependencies (pip ecosystem via poetry.lock)
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    reviewers:
      - marcoaureliomenezes
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    reviewers:
      - marcoaureliomenezes
    commit-message:
      prefix: "chore(ci)"
