[tool.poetry]
name = "dadaia-workspace"
version = "0.4.2"
description = "AI-native workspace management CLI for multi-agent development with Claude Code, Codex and Kimi Code"
authors = ["Marco Menezes <marcoaureliomenezes@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "dadaia_workspace"}]
# Public-source hygiene (T-011-15 / FR-W5-01): never ship compiled bytecode in the
# sdist/wheel. poetry-core honours these globs for both artifacts.
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
keywords = [
    "ai-agents", "claude-code", "codex", "kimi-code",
    "workspace", "multi-agent", "sdd", "spec-driven-development",
    "developer-tools", "cli", "agentic"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[tool.poetry.scripts]
dadaia = "dadaia_workspace.cli.main:_safe_app"

[tool.poetry.dependencies]
python = "^3.12"
typer = ">=0.27.1"
rich = ">=13,<16"
openpyxl = "^3.1"
pyyaml = "^6.0"
jinja2 = "^3.1"
jsonschema = "^4"
mistune = ">=3.0,<4.0"

# Optional runtime extra — the Claude Agent SDK enables live Claude execution via
# ClaudeSdkAdapter. It is NOT a base dependency: the offline-first build and lockfile
# stay SDK-free, the adapter lazily imports it, and base installs never pull it. Enable
# with `pip install dadaia-workspace[claude-sdk]`.
claude-agent-sdk = {version = ">=0.2.132,<1.0", optional = true}

[tool.poetry.extras]
claude-sdk = ["claude-agent-sdk"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
ruff = ">=0.16.2"
mypy = ">=2.3.0,<3.0"
types-PyYAML = ">=6.0.12.20260815"
pytest-randomly = "^4.1.0"
import-linter = ">=2.11"

# Dev/build tooling CVE floors (security audit F-6, sec-reviewer 2026-06-10;
# re-verified T-011-17 / residual R9, 2026-06-10).
# `pip`, `poetry`, and `dulwich` are NOT declared dependencies of this project and do
# not appear in `poetry.lock` (build-system uses `poetry-core`, which has no dulwich in
# its closure — verified: `grep name=\"(pip|poetry|dulwich)\" poetry.lock` -> 0 hits).
# The flagged CVEs live only in the workspace *tool* environment (`.dadaia/.venv`),
# where `poetry` (and its transitive `dulwich`) and `pip` are installed to operate the
# workspace — pip-installed, not locked here. They are therefore outside this repo's
# lockfile control. Required safe floors, enforced on the tool environment only:
#   pip     >= 25.3   (CVE-2025-8869  — sdist symlink traversal; project venv is 26.0.1, OK)
#   poetry  >= 2.3.4  (CVE-2026-34591, CVE-2026-41140)
#   dulwich >= 1.2.5  (CVE-2026-42305, CVE-2026-47734  — poetry transitive)
#
# R9 disposition (T-011-17): DEFERRED — cannot be remediated from this repo.
#   * No lockfile bump is possible: these packages are not in poetry.lock, so neither a
#     pyproject constraint nor `poetry update` would touch them. Declaring `poetry` as a
#     dev dep is rejected as unjustified dependency drift (it pulls poetry's entire heavy
#     tree, incl. dulwich, into every contributor install + the lock).
#   * pip-audit was unavailable in the project venv on the implementing host; audit was
#     performed via `python -m pip list --format json` against both venvs + these CVE
#     floors. The live tool venv was found at poetry 1.8.3 / dulwich 0.21.7 / pip 24.0 —
#     all below floor — but `poetry` is broken (snap-confined, non-executable) on that
#     host, so the tool venv cannot be regenerated here.
#   * Operator/devops remediation (rebuild/upgrade the tool venv, NOT a repo lock op):
#       .dadaia/.venv/bin/pip install --upgrade 'pip>=25.3' 'poetry>=2.3.4' 'dulwich>=1.2.5'
#     then re-verify: .dadaia/.venv/bin/pip list | grep -Ei '^(pip|poetry|dulwich) '
hypothesis = ">=6.165.2"
pytest-xdist = "^3.8.0"
pytest-timeout = "^2.3.1"

# Optional, non-default dependency group — mutation testing (FR20, T-043-28). A plain
# `poetry install` (what CI, the push preflight, and every consumer install already run)
# never pulls this group: it requires an explicit `poetry install --with mutation`.
# Selection verdict: qa-engineer, .dadaia/tmp/qa-engineer/20260817/
# v0.4.3-T-043-28-mutation-tool-verdict.md. Exact pin per FR1 (T-043-03's pin rule).
[tool.poetry.group.mutation]
optional = true

[tool.poetry.group.mutation.dependencies]
mutmut = "3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

# Complexity/size governance (FR21a, T-043-29, R8): a MEASURED RATCHET, never an
# aspiration. `C90` (McCabe cyclomatic complexity) and `PLR1702` (nesting depth) are
# selected with ceilings pinned AT the maxima observed by ruff's own V6 measurement
# capture (`.dadaia/tmp/software-engineer/20260817/v0.4.3-T-043-29-v6-complexity-maxima.md`),
# over the same scope this repo's `ruff check .` gate already covers (production +
# tests + scripts) — never a smaller, aspirational number. The worst offender at
# measurement time was `dadaia_workspace/features/panel/handler.py:make_handler_class`
# (complexity 63) and `dadaia_workspace/features/telemetry/reader/allowlist.py` (nesting
# depth 6); both already sit inside `dadaia_workspace/`, so no tests-only per-file-ignore
# was needed to keep `ruff check` green at HEAD by construction (A21.2).
#
# RATCHET DIRECTION — read before touching either ceiling below:
# `max-complexity` and `max-nested-blocks` may only DECREASE, never increase. A future
# release lowering either number re-measures first (same two-step rule: measure, then
# pin) and justifies the decrease in that release's CLOSURE.md `## Size accounting`
# table (A21.3/A21.5, wired by T-043-30's mandatory closure section). Raising a ceiling
# to make a check pass is exactly the aspirational-number failure R8 forbids — refuse
# it; refactor the offending function or split the file instead.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "PLR1702"]
ignore = ["E501", "B008", "B903"]
# `preview = true` is required only because PLR1702 (too-many-nested-blocks) is still a
# preview-status Pylint rule in ruff 0.16.2 (`ruff rule PLR1702` prints "The --preview
# flag is required for use") — selecting its exact code with no CLI/config preview flag
# is silently inert (ruff emits "has no effect because preview is not enabled" and skips
# it entirely). Enabling preview mode also activates every OTHER preview-status rule
# nested under an already-selected prefix; measured side effect at v0.16.2: exactly one,
# `B903` (class-as-data-structure, flake8-bugbear preview), 4 hits in
# `tests/{integration/panel,unit/features/telemetry}/**` — added to `ignore` above
# rather than silently widening this task's declared write set (pyproject.toml select +
# mccabe config only) into unrelated test-file edits. `preview` is scoped to
# `[tool.ruff.lint]` only (never `[tool.ruff]`/`[tool.ruff.format]`), so it never
# changes `ruff format --check .`'s result — verified identical (same 5
# pre-existing, unrelated, bug-registered `specs/_archive/**` findings; see
# `ruff-0-16-2-markdown-python-fence-format-drift`) with and without this diff.
preview = true

[tool.ruff.lint.mccabe]
# Ceiling pinned at the measured maximum (V6). Ratchets DOWN ONLY — see the doctrine
# comment above `[tool.ruff.lint]`.
max-complexity = 63

[tool.ruff.lint.pylint]
# Ceiling pinned at the measured maximum (V6). Ratchets DOWN ONLY — see the doctrine
# comment above `[tool.ruff.lint]`.
max-nested-blocks = 6

[tool.ruff.lint.per-file-ignores]
"dadaia_workspace/cli/commands/*.py" = ["B904"]
"dadaia_workspace/cli/commands/repos.py" = ["SIM118"]
# Test files that place pytestmark before platform-gated imports (E402 is intentional).
"tests/unit/infrastructure/test_telemetry_lock_posix.py" = ["E402", "I001"]
"tests/unit/infrastructure/test_telemetry_lock_windows.py" = ["E402", "I001"]

# Bug ruff-0-16-2-markdown-python-fence-format-drift: ruff 0.16.2 started reformatting
# fenced Python code blocks embedded in Markdown by default, which reached 5
# pre-existing files under specs/_archive/releases/**. Those paths are FROZEN
# (DADAIA.md section 3 / gate_policy.py's four `_archive/` prefixes) -- archive by
# `git mv`, NEVER edit -- so the root-cause fix is to put every FROZEN archive prefix
# outside the formatter's reach BY CONFIGURATION rather than reformatting archived
# content. Scoped to `[tool.ruff.format]` only (never the shared `[tool.ruff]`
# exclude): `ruff check` does not process `.md` files at all (verified empirically --
# "No Python files found" on any of the 5 affected files), so widening the lint-visible
# exclude would weaken nothing but is avoided anyway to keep this fix minimal. Scoped
# to archive prefixes only, not all Markdown: verified no non-archive `.md` file is
# reformatted by 0.16.2 (the pre-fix `ruff format --check --no-cache .` run reported
# exactly these 5 archive paths and no others). The trailing `/**` is load-bearing:
# a bare `specs/_archive` (or `specs/_archive/`) only matches that literal path
# segment and does not prune the recursive subtree -- verified empirically (still 5
# failures without `/**`; 0 with it).
[tool.ruff.format]
exclude = [
    "specs/_archive/**",
    "specs/backlog/_archive/**",
    "specs/audits/_archive/**",
    "specs/bugs/_archive/**",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
incremental = false
# No cache_dir here (bug mypy-strict-cache-dir-created-without-cache-dir-env-override):
# mypy 2.x writes .mypy_cache/ (CACHEDIR.TAG + a version dir) at cache_dir's default
# regardless of `incremental = false` -- that claim was false. There is no cache_dir
# value that is BOTH portable (no hardcoded absolute path; `$MYPY_CONFIG_FILE_DIR/..`
# assumes this checkout's depth under a workspace root, and an unwritable resolved
# target crashes mypy with an INTERNAL ERROR -- verified, not merely feared) AND
# guaranteed outside the repo tree, so redirect via the MYPY_CACHE_DIR env var instead
# (mypy's own supported override) -- exactly what CI does (ci.yml) and what
# `dadaia ci preflight` does automatically (--cache-dir, see
# features/ci_preflight/service.py:resolve_mypy_cache_dir). A bare local
# `mypy --strict dadaia_workspace/` with no redirect WILL create .mypy_cache/ here;
# run `dadaia ci preflight` instead, or set MYPY_CACHE_DIR yourself.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = [
    "unit: pure or near-pure fast tests",
    "contract: public API/schema/security contracts",
    "integration: multi-component tests using real tmp filesystem or CLI runner",
    "e2e: full user journeys and browser-backed flows",
    "slow: tests over 1s or tests that start a server/subprocess",
    "tmp: temporary debugging tests excluded from default runs",
    "flaky: observed pass+fail on identical code; being diagnosed (dadaia-test-stewardship F)",
    "quarantine: out of gating selectors; requires bug= id and expires (dadaia-test-stewardship F)",
]
norecursedirs = [
    ".*",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "build",
    "dist",
    "venv",
    ".venv",
    "tests/tmp",
]
# Disk guard: only retain tmp_path trees for FAILED tests (default keeps the last 3
# full sessions, which — combined with per-test venvs — exhausted the disk). See the
# _no_real_venv_in_tests backstop in tests/conftest.py.
tmp_path_retention_policy = "failed"

[tool.coverage.run]
source = ["dadaia_workspace"]
parallel = false

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# Mutation-testing config (FR20, T-043-28). This table is INERT here — mutmut's own
# `mutants/` sandbox directory is hardcoded relative to its invocation cwd with no
# config key to redirect it (mutmut configuration.py:107), which collides with this
# repo's "no caches in the repo tree" law (DADAIA.md §4) if invoked with cwd = repo
# root. mutmut is therefore never invoked against THIS file: the actual execution cwd
# is a staged copy under `.dadaia/tmp/software-engineer/<date>/mutation-run/` (see
# `tests/scripts/run_mutation_baseline.sh`), which carries its own generated
# `pyproject.toml` with these same keys. This copy is the single documented source of
# truth for what those keys should be, kept in sync by hand at each release's run.
#
# Scope is `core/models/` (the verdict's own already-validated smoke-trial sub-slice),
# not the wider `core/` the verdict recommended for the first baseline: mutmut's
# `mutants/` sandbox mirrors ONLY `source_paths` on disk, and `tests/unit/core/` (flat)
# contains real cross-layer architecture tests (e.g. test_kernel_tunables.py imports
# `dadaia_workspace.hooks.*`) that cannot run inside any sandbox narrower than the whole
# package. Widening this scope is real follow-up work, not done here — see the runner
# script's header for the full narrowing rationale.
[tool.mutmut]
source_paths = ["dadaia_workspace/core/models"]
pytest_add_cli_args_test_selection = ["tests/unit/core/models"]
mutate_only_covered_lines = true
use_git_change_detection = false
