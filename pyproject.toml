[tool.poetry]
name = "dadaia-workspace"
version = "0.1.10"
description = "AI-native workspace management CLI for multi-agent development with Claude Code, Codex and OpenCode"
authors = ["Marco Menezes <marcoaurelioreislima@gmail.com>"]
readme = "README.md"
packages = [{include = "dadaia_workspace"}]
# Public-source hygiene (T-011-15 / FR-W5-01): never ship compiled bytecode in the
# sdist/wheel. poetry-core honours these globs for both artifacts.
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
keywords = [
    "ai-agents", "claude-code", "codex", "opencode",
    "workspace", "multi-agent", "sdd", "spec-driven-development",
    "developer-tools", "cli", "agentic"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[tool.poetry.scripts]
dadaia = "dadaia_workspace.cli.main:_safe_app"

[tool.poetry.dependencies]
python = "^3.12"
typer = {extras = ["all"], version = ">=0.25"}
rich = ">=13,<16"
openpyxl = "^3.1"
pyyaml = "^6.0"
jinja2 = "^3.1"
jsonschema = "^4"
mistune = ">=3.0,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
ruff = ">=0.15"
mypy = ">=1.10,<3.0"
types-PyYAML = ">=6"
pytest-randomly = "^4.1.0"
import-linter = ">=2.11"

# Dev/build tooling CVE floors (security audit F-6, sec-reviewer 2026-06-10).
# `poetry` and `dulwich` are NOT declared dependencies of this project and do not
# appear in `poetry.lock` (build-system uses `poetry-core`, which has no dulwich in
# its closure). The flagged CVEs live only in the workspace tool environment where
# `poetry` is installed to operate the workspace (pip-installed into the venv, not
# locked here). They are therefore outside this repo's lockfile control. The required
# safe floors — enforced on the *tool* environment, not this project's deps — are:
#   poetry  >= 2.3.4  (CVE-2026-34591, CVE-2026-41140)
#   dulwich >= 1.2.5  (CVE-2026-42305, CVE-2026-47734  — poetry transitive)
# Upgrading the live tool venv (.dadaia/.venv) is an operator/devops action; declaring
# `poetry` as a dev dep here is rejected as unjustified dependency drift (it would pull
# poetry's entire heavy tree, incl. dulwich, into every contributor install and the lock).
hypothesis = ">=6.100"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"dadaia_workspace/cli/commands/*.py" = ["B904"]
"dadaia_workspace/cli/commands/repos.py" = ["SIM118"]
# Test files that place pytestmark before platform-gated imports (E402 is intentional).
"tests/unit/infrastructure/test_file_lock_posix.py" = ["E402", "I001"]
"tests/unit/infrastructure/test_file_lock_windows.py" = ["E402", "I001"]
"tests/unit/infrastructure/test_telemetry_lock_posix.py" = ["E402", "I001"]
"tests/unit/infrastructure/test_telemetry_lock_windows.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
incremental = false
# No cache_dir: `incremental = false` already disables the mypy cache, so no
# .mypy_cache/ is created in the repo tree, and there is no non-portable
# hardcoded path (the previous "/dev/null" was Unix-only). CI redirects any
# tool caches via env vars (MYPY_CACHE_DIR -> $RUNNER_TEMP); see ci.yml.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = [
    "unit: pure or near-pure fast tests",
    "contract: public API/schema/security contracts",
    "integration: multi-component tests using real tmp filesystem or CLI runner",
    "e2e: full user journeys and browser-backed flows",
    "slow: tests over 1s or tests that start a server/subprocess",
    "tmp: temporary debugging tests excluded from default runs",
]
norecursedirs = [
    ".*",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "build",
    "dist",
    "venv",
    ".venv",
    "tests/tmp",
]
# Disk guard: only retain tmp_path trees for FAILED tests (default keeps the last 3
# full sessions, which — combined with per-test venvs — exhausted the disk). See the
# _no_real_venv_in_tests backstop in tests/conftest.py.
tmp_path_retention_policy = "failed"

[tool.coverage.run]
source = ["dadaia_workspace"]
parallel = false

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
