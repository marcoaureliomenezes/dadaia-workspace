[tool.poetry]
name = "dadaia-workspace"
version = "0.4.7"
description = "A local-first, spec-driven workspace that gives AI agents current context, a document-governed lifecycle, visible concurrency and anti-slop boundaries."
authors = ["Marco Menezes <marcoaureliomenezes@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "dadaia_workspace"}]
# Public-source hygiene (T-011-15 / FR-W5-01): never ship compiled bytecode in the
# sdist/wheel. poetry-core honours these globs for both artifacts.
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
# Every keyword names something the README says; it is also the GitHub topic set
# (SPEC 0.4.7 FR4). "developer-tools" and "agentic" were dropped: the README claims
# neither.
keywords = [
    "ai-agents", "claude-code", "codex", "kimi-code",
    "workspace", "multi-agent", "sdd", "spec-driven-development",
    "cli"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# What PyPI renders beside the long description. Homepage is the PyPI project page;
# Documentation is the repository's docs/ folder (no separate site is published).
[tool.poetry.urls]
Homepage = "https://pypi.org/project/dadaia-workspace/"
Repository = "https://github.com/marcoaureliomenezes/dadaia-workspace"
Documentation = "https://github.com/marcoaureliomenezes/dadaia-workspace/tree/main/docs"
Changelog = "https://github.com/marcoaureliomenezes/dadaia-workspace/blob/main/CHANGELOG.md"
Issues = "https://github.com/marcoaureliomenezes/dadaia-workspace/issues"

[tool.poetry.scripts]
dadaia = "dadaia_workspace.cli.main:_safe_app"
dadaia-workspace = "dadaia_workspace.cli.main:_safe_app"

[tool.poetry.dependencies]
python = "^3.12"
typer = ">=0.27.1"
rich = ">=13,<16"
pyyaml = "^6.0"
jsonschema = "^4"


[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
ruff = ">=0.16.2"
mypy = ">=2.3.0,<3.0"
types-PyYAML = ">=6"
pytest-randomly = "^4.1.0"
import-linter = ">=2.11"
# The declared build backend, so the bootstrap e2e can `pip wheel --no-build-isolation`
# the checkout offline in any environment that ran `poetry install --with dev` (CI included).
poetry-core = ">=1.9"

# Dev/build tooling CVE floors (security audit F-6, sec-reviewer 2026-06-10;
# re-verified T-011-17 / residual R9, 2026-06-10).
# `pip`, `poetry`, and `dulwich` are NOT declared dependencies of this project and do
# not appear in `poetry.lock` (build-system uses `poetry-core`, which has no dulwich in
# its closure — verified: `grep name=\"(pip|poetry|dulwich)\" poetry.lock` -> 0 hits).
# The flagged CVEs live only in the workspace *tool* environment (`.dadaia/.venv`),
# where `poetry` (and its transitive `dulwich`) and `pip` are installed to operate the
# workspace — pip-installed, not locked here. They are therefore outside this repo's
# lockfile control. Required safe floors, enforced on the tool environment only:
#   pip     >= 25.3   (CVE-2025-8869  — sdist symlink traversal; project venv is 26.0.1, OK)
#   poetry  >= 2.3.4  (CVE-2026-34591, CVE-2026-41140)
#   dulwich >= 1.2.5  (CVE-2026-42305, CVE-2026-47734  — poetry transitive)
#
# R9 disposition (T-011-17): DEFERRED — cannot be remediated from this repo.
#   * No lockfile bump is possible: these packages are not in poetry.lock, so neither a
#     pyproject constraint nor `poetry update` would touch them. Declaring `poetry` as a
#     dev dep is rejected as unjustified dependency drift (it pulls poetry's entire heavy
#     tree, incl. dulwich, into every contributor install + the lock).
#   * pip-audit was unavailable in the project venv on the implementing host; audit was
#     performed via `python -m pip list --format json` against both venvs + these CVE
#     floors. The live tool venv was found at poetry 1.8.3 / dulwich 0.21.7 / pip 24.0 —
#     all below floor — but `poetry` is broken (snap-confined, non-executable) on that
#     host, so the tool venv cannot be regenerated here.
#   * Operator/devops remediation (rebuild/upgrade the tool venv, NOT a repo lock op):
#       .dadaia/.venv/bin/pip install --upgrade 'pip>=25.3' 'poetry>=2.3.4' 'dulwich>=1.2.5'
#     then re-verify: .dadaia/.venv/bin/pip list | grep -Ei '^(pip|poetry|dulwich) '
hypothesis = ">=6.165.2"
pytest-xdist = "^3.8.0"
pytest-timeout = "^2.3.1"

# Optional, non-default dependency group — mutation testing (FR20, T-043-28). A plain
# `poetry install` (what CI, the push preflight, and every consumer install already run)
# never pulls this group: it requires an explicit `poetry install --with mutation`.
# Selection verdict: qa-engineer, .dadaia/tmp/qa-engineer/20260817/
# v0.4.3-T-043-28-mutation-tool-verdict.md. Exact pin per FR1 (T-043-03's pin rule).
[tool.poetry.group.mutation]
optional = true

[tool.poetry.group.mutation.dependencies]
mutmut = "3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
# 0.4.7 FR3: the cache is redirected by CONFIGURATION, not by a flag on every command
# (the venv guard's cache rule is deleted). The path is RELATIVE — resolved the same way
# on every OS, and from a `repos/<slug>/` checkout it lands in the workspace's own
# `.dadaia/tmp/` zone. From a standalone CI checkout it lands in the checkout's
# grandparent, which is writable on every runner. Either way the repo tree stays clean.
cache-dir = "../../.dadaia/tmp/ruff-cache"
target-version = "py312"

# Complexity/size governance (FR21a, R8): a MEASURED RATCHET. `C90` and `PLR1702` are
# pinned AT the maxima `ruff check .` measures over production + tests + scripts
# (0.5.0 shrink pass: C901 26 `core/handoff_index.py::_validate_node`, nesting 5). Both
# ceilings only DECREASE — re-measure, then pin; never raise one to make a check pass.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "PLR1702"]
ignore = ["E501", "B008"]
# PLR1702 is a preview-status rule in ruff; without `preview` it is silently inert.
# Scoped to lint only, so `ruff format --check` is unaffected.
preview = true

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.pylint]
max-nested-blocks = 5

# Bug ruff-0-16-2-markdown-python-fence-format-drift: ruff 0.16.2 started reformatting
# fenced Python code blocks embedded in Markdown by default, which reached 5
# pre-existing files under specs/_archive/releases/**. Those paths are FROZEN
# (DADAIA.md section 3 / gate_policy.py's four `_archive/` prefixes) -- archive by
# `git mv`, NEVER edit -- so the root-cause fix is to put every FROZEN archive prefix
# outside the formatter's reach BY CONFIGURATION rather than reformatting archived
# content. Scoped to `[tool.ruff.format]` only (never the shared `[tool.ruff]`
# exclude): `ruff check` does not process `.md` files at all (verified empirically --
# "No Python files found" on any of the 5 affected files), so widening the lint-visible
# exclude would weaken nothing but is avoided anyway to keep this fix minimal. Scoped
# to archive prefixes only, not all Markdown: verified no non-archive `.md` file is
# reformatted by 0.16.2 (the pre-fix `ruff format --check --no-cache .` run reported
# exactly these 5 archive paths and no others). The trailing `/**` is load-bearing:
# a bare `specs/_archive` (or `specs/_archive/`) only matches that literal path
# segment and does not prune the recursive subtree -- verified empirically (still 5
# failures without `/**`; 0 with it).
[tool.ruff.format]
exclude = [
    "specs/_archive/**",
    "specs/backlog/_archive/**",
    "specs/audits/_archive/**",
    "specs/bugs/_archive/**",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
incremental = false
# 0.4.7 FR3: same relative redirect as `[tool.ruff] cache-dir` — one rule, both tools,
# every OS. mypy writes `.mypy_cache/` even with `incremental = false` (bug
# mypy-strict-cache-dir-created-without-cache-dir-env-override), so the destination must
# be named; a relative path is the only portable value (an absolute one is
# machine-specific and `/dev/null` is POSIX-only — ruff cannot even open it).
cache_dir = "../../.dadaia/tmp/mypy-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = [
    "unit: pure or near-pure fast tests",
    "contract: public API/schema/security contracts",
    "integration: multi-component tests using real tmp filesystem or CLI runner",
    "e2e: full user journeys through the real CLI",
    "slow: tests over 1s or tests that start a server/subprocess",
    "tmp: temporary debugging tests excluded from default runs",
    "flaky: observed pass+fail on identical code; being diagnosed (dd-test-stewardship, flakes and quarantine)",
    "quarantine: out of gating selectors; requires bug= id and expires (dd-test-stewardship, flakes and quarantine)",
]
norecursedirs = [
    ".*",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "build",
    "dist",
    "venv",
    ".venv",
    "tests/tmp",
]
# Disk guard: only retain tmp_path trees for FAILED tests (default keeps the last 3
# full sessions, which — combined with per-test venvs — exhausted the disk). See the
# _no_real_venv_in_tests backstop in tests/conftest.py.
tmp_path_retention_policy = "failed"

[tool.coverage.run]
source = ["dadaia_workspace"]
parallel = false

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# Mutation-testing config (FR20, T-043-28). This table is INERT here — mutmut's own
# `mutants/` sandbox directory is hardcoded relative to its invocation cwd with no
# config key to redirect it (mutmut configuration.py:107), which collides with this
# repo's "no caches in the repo tree" law (DADAIA.md §4) if invoked with cwd = repo
# root. mutmut is therefore never invoked against THIS file: the actual execution cwd
# is a staged copy under `.dadaia/tmp/software-engineer/<date>/mutation-run/` (see
# `tests/scripts/run_mutation_baseline.sh`), which carries its own generated
# `pyproject.toml` with these same keys. This copy is the single documented source of
# truth for what those keys should be, kept in sync by hand at each release's run.
#
# Scope is `core/models/` (the verdict's own already-validated smoke-trial sub-slice),
# not the wider `core/` the verdict recommended for the first baseline: mutmut's
# `mutants/` sandbox mirrors ONLY `source_paths` on disk, and `tests/unit/core/` (flat)
# contains real cross-layer architecture tests (e.g. test_kernel_tunables.py imports
# `dadaia_workspace.hooks.*`) that cannot run inside any sandbox narrower than the whole
# package. Widening this scope is real follow-up work, not done here — see the runner
# script's header for the full narrowing rationale.
[tool.mutmut]
source_paths = ["dadaia_workspace/core/models"]
pytest_add_cli_args_test_selection = ["tests/unit/core/models"]
mutate_only_covered_lines = true
use_git_change_detection = false
