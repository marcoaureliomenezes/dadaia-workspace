[tool.poetry]
name = "dadaia-workspace"
version = "0.1.2"
description = "AI-native workspace management CLI for multi-agent development with Claude Code, Codex and OpenCode"
authors = ["Marco Menezes <marcoaurelioreislima@gmail.com>"]
readme = "README.md"
packages = [{include = "dadaia_workspace"}]
keywords = [
    "ai-agents", "claude-code", "codex", "opencode",
    "workspace", "multi-agent", "sdd", "spec-driven-development",
    "developer-tools", "cli", "agentic"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.scripts]
dadaia = "dadaia_workspace.cli.main:_safe_app"

[tool.poetry.dependencies]
python = "^3.12"
typer = {extras = ["all"], version = ">=0.25"}
rich = "^13"
openpyxl = "^3.1"
pyyaml = "^6.0"
jinja2 = "^3.1"
jsonschema = "^4"
mistune = ">=3.0,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = "^5"
ruff = ">=0.15"
mypy = "^1.10"
types-PyYAML = ">=6"
pytest-randomly = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"dadaia_workspace/cli/commands/*.py" = ["B904"]
"dadaia_workspace/cli/commands/repos.py" = ["SIM118"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dadaia_workspace --cov-report=term-missing --cov-fail-under=80"
# Disk guard: only retain tmp_path trees for FAILED tests (default keeps the last 3
# full sessions, which — combined with per-test venvs — exhausted the disk). See the
# _no_real_venv_in_tests backstop in tests/conftest.py.
tmp_path_retention_policy = "failed"

[tool.coverage.run]
source = ["dadaia_workspace"]
parallel = false

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
