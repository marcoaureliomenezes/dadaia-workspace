# import-linter contracts — enforce the cross-platform layering law (release 0.1.8, T-018-07).
#
# Two architectural invariants are enforced in CI (the `lint` job runs `lint-imports`):
#   (a) features/ must not import infrastructure/ directly — feature logic depends on
#       core/protocols, and container.py injects the concrete adapter.
#   (b) core/ must not import OS-primitive modules (fcntl/signal/subprocess/msvcrt) — the
#       only authorized platform-detection site is core/platform.py (which reads `sys`).
#
# The `ignore_imports` under contract (a) are DOCUMENTED, pre-existing or transitional
# exceptions, not a licence for new violations: the contract still fails on any NEW
# features->infrastructure import. The transitional lock/telemetry adapter selections are
# the ADR-1 lazy defaults (interim sys.platform guard; full container DI is the follow-up).
# The three markdown/launcher store imports are pre-existing tech debt tracked in backlog
# item `features-import-infrastructure-direct-debt` for a later DI cleanup.

[importlinter]
root_package = dadaia_workspace
include_external_packages = True

[importlinter:contract:features-no-infrastructure]
name = features must not import infrastructure directly (DI via core.protocols)
type = forbidden
source_modules =
    dadaia_workspace.features
forbidden_modules =
    dadaia_workspace.infrastructure
ignore_imports =
    # Transitional ADR-1 lazy lock/telemetry adapter selection (TODO: full container DI):
    dadaia_workspace.features.spec_context.locking -> dadaia_workspace.infrastructure.file_lock_posix
    dadaia_workspace.features.spec_context.locking -> dadaia_workspace.infrastructure.file_lock_windows
    dadaia_workspace.features.telemetry.service -> dadaia_workspace.infrastructure.telemetry_lock_posix
    dadaia_workspace.features.telemetry.service -> dadaia_workspace.infrastructure.telemetry_lock_windows
    # Pre-existing debt (backlog: features-import-infrastructure-direct-debt):
    dadaia_workspace.features.workflows.service -> dadaia_workspace.infrastructure.markdown_workflow_store
    dadaia_workspace.features.agents.reader -> dadaia_workspace.infrastructure.markdown_agent_store
    dadaia_workspace.features.panel.service -> dadaia_workspace.infrastructure.workflow_launcher_adapter

[importlinter:contract:core-no-os-primitives]
name = core must not import OS-primitive modules (platform seam is the sole exception)
type = forbidden
source_modules =
    dadaia_workspace.core
forbidden_modules =
    fcntl
    signal
    subprocess
    msvcrt
