# import-linter contracts — document the cross-platform layering law (release 0.1.8, T-018-07).
#
# STATUS (v0.1.54): these contracts are GREEN (8 kept, 0 broken) and ENFORCED — the CI
# `Lint (ruff)` job runs `lint-imports --config setup.cfg --no-cache`, and `dadaia ci
# preflight` carries a fail-closed lint-imports check, so the pre-push hook gates every
# push on them. The former red chains were fixed and the backlog entry
# `import-boundary-enforcement` was consumed by release v0.1.54.
#
# The two architectural invariants the contracts describe:
#   (a) features/ must not import infrastructure/ directly — feature logic depends on
#       core/protocols, and container.py injects the concrete adapter.
#   (b) core/ must not import OS-primitive modules (fcntl/signal/subprocess/msvcrt) — the
#       only authorized platform-detection site is core/platform.py (which reads `sys`).
#
# The `ignore_imports` under contract (a) are DOCUMENTED, pre-existing or transitional
# exceptions, not a licence for new violations: the contract still fails on any NEW
# features->infrastructure import. The transitional lock/telemetry adapter selections are
# the ADR-1 lazy defaults (interim sys.platform guard; full container DI is the follow-up).
# The three markdown/launcher store imports are pre-existing tech debt tracked in backlog
# item `features-import-infrastructure-direct-debt` for a later DI cleanup.
#
# IGNORE-EDGE CAP (arch F10, T-010-27): the total number of `ignore_imports` edges across
# ALL contracts below is CAPPED and pinned in tests/contract/test_import_linter_ignore_cap.py.
# Current count = 24 (features-no-infrastructure: 9; features-no-subprocess: 4;
# features-no-cross-feature: 11) as of v0.1.76 (lock liberation deleted the
# doctor_coherence -> lease/session_identity edges; -2). The cli-no-infrastructure
# family dropped 10 -> 7 in the same release (lock verb deleted; specs/context pid_probe
# seams retired). Each edge is a SUPPRESSED layering violation. LOWERING the count (deleting an edge after a DI
# cleanup) is encouraged — also lower the cap in that test. RAISING it (adding a new ignored
# edge) requires a rationale comment on the edge here AND a bump of the recorded cap in that
# test, both in the SAME commit, so the architecture debt only ever grows on purpose.
# v0.1.53 (FR3): the two `panel.service -> workflow_launcher_adapter` edges were removed —
# W1 deleted the launcher adapter, so those ignores no longer matched any import and made
# `lint-imports` error ("No matches for ignored import"). Cap lowered 17 -> 15.
#
# CACHE HYGIENE (v0.1.53 FR3): import-linter's default cache dir (`.import_linter_cache/`)
# is a repo-hygiene violation in the working tree (it must not exist inside any repo — see
# the workspace root AGENTS.md "Repo cleanliness" law). import-linter reads the cache dir
# only from the CLI (`--cache-dir` / `--no-cache`), never from this config, so ALWAYS run
# `lint-imports --no-cache`. The hygiene probe
# `tests/contract/test_import_linter_cache_hygiene.py` runs lint-imports that way and
# asserts no cache dir is left in the tree.

[importlinter]
root_package = dadaia_workspace
include_external_packages = True

[importlinter:contract:features-no-infrastructure]
name = features must not import infrastructure directly (DI via core.protocols)
type = forbidden
source_modules =
    dadaia_workspace.features
forbidden_modules =
    dadaia_workspace.infrastructure
ignore_imports =
    # Transitional ADR-1 lazy lock/telemetry adapter selection (TODO: full container DI):
    dadaia_workspace.features.spec_context.locking -> dadaia_workspace.infrastructure.file_lock_posix
    dadaia_workspace.features.spec_context.locking -> dadaia_workspace.infrastructure.file_lock_windows
    dadaia_workspace.features.telemetry.service -> dadaia_workspace.infrastructure.telemetry_lock_posix
    dadaia_workspace.features.telemetry.service -> dadaia_workspace.infrastructure.telemetry_lock_windows
    # (v0.1.54 FR5, T-54-12) The two `markdown_*_store` direct-debt edges
    # (`workflows.service -> markdown_workflow_store`, `agents.reader -> markdown_agent_store`)
    # were REMOVED here: the concrete store now arrives via container `store_factory`
    # injection typed against a feature-local Protocol, so neither feature holds a
    # `features -> infrastructure` edge. Cap lowered 28 -> 26 in the same commit.
    # v0.1.9 T-CODE-01: lazy ProcessRunner adapter fallback when no runner is injected
    # (constructor DI is the primary path; full container DI is the follow-up tracked in
    # backlog features-import-infrastructure-direct-debt):
    dadaia_workspace.features.specs.doctor_memory -> dadaia_workspace.infrastructure.subprocess_runner
    dadaia_workspace.features.server_registry.scan -> dadaia_workspace.infrastructure.subprocess_runner
    dadaia_workspace.features.ci_preflight.service -> dadaia_workspace.infrastructure.subprocess_runner
    dadaia_workspace.features.import_.service -> dadaia_workspace.infrastructure.subprocess_runner
    # v0.1.10 T-010-24 (R8b): the public-doctor model-resolution check reads the genuine
    # MODEL_MAP derived view to compare its key-set against PRICING_TABLE/REGISTRY (the
    # anti-drift defense for bug model-catalog-modelmap-pricing-drift-no-registry). MODEL_MAP
    # is pure core-registry-derived data (no I/O); this is a benign data re-export, not a
    # behavioral coupling. Counts toward the import-linter ignore-list cap (T-010-27).
    dadaia_workspace.features.public.model_resolution -> dadaia_workspace.infrastructure.runtime_transforms.model_mapping

[importlinter:contract:features-no-subprocess]
name = features must not import subprocess directly (use ProcessRunner via core.protocols)
type = forbidden
source_modules =
    dadaia_workspace.features
forbidden_modules =
    subprocess
ignore_imports =
    # The sanctioned subprocess boundary is the infrastructure adapter, reached via the
    # ProcessRunner Protocol (injected) or a lazy fallback import. Ignoring the
    # features->adapter edge breaks the transitive features->subprocess chain while a
    # direct `import subprocess` inside features stays forbidden (the audited defect).
    # These lazy fallbacks are tracked debt (full container DI is the follow-up):
    # backlog item `features-import-infrastructure-direct-debt`.
    dadaia_workspace.features.specs.doctor_memory -> dadaia_workspace.infrastructure.subprocess_runner
    dadaia_workspace.features.server_registry.scan -> dadaia_workspace.infrastructure.subprocess_runner
    dadaia_workspace.features.ci_preflight.service -> dadaia_workspace.infrastructure.subprocess_runner
    dadaia_workspace.features.import_.service -> dadaia_workspace.infrastructure.subprocess_runner

[importlinter:contract:core-no-os-primitives]
name = core must not import OS-primitive modules (platform seam is the sole exception)
type = forbidden
source_modules =
    dadaia_workspace.core
forbidden_modules =
    fcntl
    signal
    subprocess
    msvcrt

# REVERSE-DIRECTION CONTRACTS (arch A3, T-010-33): freeze the verified DOWNWARD-ONLY
# layering graph the architect found clean-by-discipline-only. `core` is the bottom
# layer (depends on nothing internal); `infrastructure` depends only on `core`. These
# two `forbidden` contracts pin those facts so a future upward import is caught by
# `lint-imports` (CI-wired since v0.1.54: lint job + preflight)
# instead of silently rotting (the rot that produced the original lock-family audit). Both
# layers are verified to have ZERO upward edges today, so neither needs an
# `ignore_imports` entry — they do not touch the ignore-edge cap (26, per v0.1.54 FR5).

[importlinter:contract:core-no-upper-layers]
name = core must not import features/infrastructure/cli/hooks (core is the bottom layer)
type = forbidden
source_modules =
    dadaia_workspace.core
forbidden_modules =
    dadaia_workspace.features
    dadaia_workspace.infrastructure
    dadaia_workspace.cli
    dadaia_workspace.hooks

[importlinter:contract:infrastructure-no-upper-layers]
name = infrastructure must not import features/cli/hooks (it depends only on core)
type = forbidden
source_modules =
    dadaia_workspace.infrastructure
forbidden_modules =
    dadaia_workspace.features
    dadaia_workspace.cli
    dadaia_workspace.hooks

# v0.1.14 T-014-01 (FR-W4-05, DP-1): the kernel tunables module is the single home for
# lifecycle timing constants. It is a pure-constant leaf — hooks/features/cli all hold a
# legal core edge to it, but it must import NOTHING internal (no reverse dependency on the
# layers that consume it). This `forbidden` contract pins the one-way edge: the tunables
# module never imports features/infrastructure/cli/hooks (the `core-no-upper-layers`
# contract above already covers `core` as a whole; this narrows the guard to the named
# module so a stray edge is reported by `lint-imports` with a precise message once it is
# CI-wired since v0.1.54).
[importlinter:contract:kernel-tunables-is-a-leaf]
name = core.kernel_tunables must import no upper layer (pure-constant single home, DP-1)
type = forbidden
source_modules =
    dadaia_workspace.core.kernel_tunables
forbidden_modules =
    dadaia_workspace.features
    dadaia_workspace.infrastructure
    dadaia_workspace.cli
    dadaia_workspace.hooks

# v0.1.54 FR2 (T-54-11): break the `workflows <-> lifecycle` import cycle and pin it. The
# lifecycle engine must never import the presentation-side workflows package: the governed
# catalog data now lives in `features/lifecycle/governed_catalog.py` (imported ONLY by the
# thin `features/workflows/dadaia_catalog.py` presentation shim, the allowed direction). This
# directed `forbidden` contract catches any future `lifecycle -> workflows` regression.
[importlinter:contract:lifecycle-no-workflows]
name = features.lifecycle must not import features.workflows (cycle break, FR2)
type = forbidden
source_modules =
    dadaia_workspace.features.lifecycle
forbidden_modules =
    dadaia_workspace.features.workflows

# v0.1.54 FR3 (T-54-11): stop cross-feature erosion. Features must be mutually independent
# (compose via container.py, never by importing a sibling feature). `independence` is the
# canonical import-linter mechanism for mutual sibling independence — a self-referential
# `forbidden` (features -> features) is rejected by import-linter 2.11 with "Modules have
# shared descendants". Every features sub-package is listed under `modules =` so a new edge
# from ANY currently-clean feature is also caught. The surviving cross-feature edges are
# documented as `ignore_imports` (each a suppressed composition-debt exception, counted by
# tests/contract/test_import_linter_ignore_cap.py); no new edge may be added silently.
[importlinter:contract:features-no-cross-feature]
name = features must be mutually independent (compose via container, not sibling imports)
type = independence
modules =
    dadaia_workspace.features.academy
    dadaia_workspace.features.agents
    dadaia_workspace.features.ai_surface
    dadaia_workspace.features.backlog
    dadaia_workspace.features.bugs
    dadaia_workspace.features.chokepoints
    dadaia_workspace.features.ci_preflight
    dadaia_workspace.features.export
    dadaia_workspace.features.import_
    dadaia_workspace.features.lifecycle
    dadaia_workspace.features.migrate
    dadaia_workspace.features.panel
    dadaia_workspace.features.public
    dadaia_workspace.features.reports
    dadaia_workspace.features.repos
    dadaia_workspace.features.server_registry
    dadaia_workspace.features.spec_artifacts
    dadaia_workspace.features.spec_context
    dadaia_workspace.features.specs
    dadaia_workspace.features.telemetry
    dadaia_workspace.features.workflows
    dadaia_workspace.features.workspace
    dadaia_workspace.features.workspace_clean
ignore_imports =
    # panel -> lifecycle (4): the panel's read-only Workflows + Model-policy views read the
    # governed model catalog (model_profiles, policy_resolver) and the fragment loader to
    # render the operator surface. Presentation-read composition over the lifecycle governance
    # layer (reaches the resolver/profiles/loader directly; container-port routing is future
    # R7/R8 work).
    dadaia_workspace.features.panel.views.workflow_policy -> dadaia_workspace.features.lifecycle.model_profiles
    dadaia_workspace.features.panel.views.workflow_policy -> dadaia_workspace.features.lifecycle.fragments.loader
    dadaia_workspace.features.panel.views.workflow_policy -> dadaia_workspace.features.lifecycle.policy_resolver
    dadaia_workspace.features.panel.views.workflows -> dadaia_workspace.features.lifecycle.model_profiles
    # panel -> workflows (1): the Workflows tab renders the dadaia-workflow catalog cards from
    # the presentation accessor list_dadaia_workflows.
    dadaia_workspace.features.panel.views.workflows -> dadaia_workspace.features.workflows.dadaia_catalog
    # workflows -> lifecycle (1): the FR2 cycle-break seam edge. The thin presentation shim
    # dadaia_catalog imports the governed catalog assembly from its lifecycle home (the one
    # allowed direction of the former workflows/lifecycle cycle; pinned by lifecycle-no-workflows).
    dadaia_workspace.features.workflows.dadaia_catalog -> dadaia_workspace.features.lifecycle.governed_catalog
    # lifecycle -> reports.validation (1): report_workflow validates emitted handoff JSON via
    # the stdlib-only reports.validation service (v0.1.55 FR3 merged the reports_* triplet into
    # the features.reports package; 1:1 target repoint, cap unchanged).
    dadaia_workspace.features.lifecycle.report_workflow -> dadaia_workspace.features.reports.validation
    # lifecycle -> backlog (4): context_selector + the backlog_definition workflow body read the
    # backlog preview / canonical subject registry / classifier to drive backlog-aware lifecycle
    # steps (context selection and the backlog_definition workflow).
    dadaia_workspace.features.lifecycle.context_selector -> dadaia_workspace.features.backlog.preview
    dadaia_workspace.features.lifecycle.context_selector -> dadaia_workspace.features.backlog.subject_registry
    dadaia_workspace.features.lifecycle.workflows.backlog_definition -> dadaia_workspace.features.backlog.classifier
    dadaia_workspace.features.lifecycle.workflows.backlog_definition -> dadaia_workspace.features.backlog.subject_registry

# v0.1.61 FR5 (T-61-30, ADR-4, audit A-2): cap the cli -> infrastructure edge class. The
# CLI layer had been reaching infrastructure adapters directly (11 sites at audit time;
# v0.1.60 added 2 unnoticed — the class was growing silently). Adjudication (ADR-4): NONE
# of the recorded edges is legitimate composition-root wiring (`container.py` is the sole
# composition root) — each is accepted, capped, ratcheted debt. Edge reduction routes to
# future container-DI work, not this release. The post-W2 edge set (plugin.py's
# FileSystemPluginPaths edge removed by FR4/W2) was re-enumerated by grep at
# implementation time = 10 module-pair edges, pinned bidirectionally in
# tests/contract/test_import_linter_ignore_cap.py (family cap 10; total 36 = 9/4/13/10).
[importlinter:contract:cli-no-infrastructure]
name = cli must not import infrastructure directly (compose via container, ADR-4 capped debt)
type = forbidden
# Direct imports only: transitive chains through `dadaia_workspace.container` are the
# LEGAL composition-root direction (cli -> container -> infrastructure adapter); the
# audited A-2 defect is the CLI holding a *direct* infrastructure import. Indirect
# reach via container/features is governed by their own contracts above.
allow_indirect_imports = True
source_modules =
    dadaia_workspace.cli
forbidden_modules =
    dadaia_workspace.infrastructure
ignore_imports =
    # lock CLI builds the pid probe directly for lock inspection (container-DI follow-up):
    # plugin CLI constructs the FileSystemPublicAssetManager for pack projection (DI follow-up):
    dadaia_workspace.cli.commands.plugin -> dadaia_workspace.infrastructure.public_assets
    # bugs CLI constructs the JsonlBugStore event-sourced store directly (DI follow-up):
    dadaia_workspace.cli.commands.bugs -> dadaia_workspace.infrastructure.jsonl_bug_store
    # top-level CLI error boundary reports uncaught exceptions via bug_reporter (DI follow-up):
    dadaia_workspace.cli.main -> dadaia_workspace.infrastructure.bug_reporter
    # specs CLI reports doctor exceptions via bug_reporter (DI follow-up):
    dadaia_workspace.cli.commands.specs -> dadaia_workspace.infrastructure.bug_reporter
    # specs CLI builds the pid probe for lease-coherence doctor checks (DI follow-up):
    # ci CLI lazily builds OsProcessProbe for the push-gate chokepoint (DI follow-up):
    dadaia_workspace.cli.commands.ci -> dadaia_workspace.infrastructure.process_probe_adapter
    # public CLI lazily imports the codex_doctor agent-skill-ref check (DI follow-up):
    dadaia_workspace.cli.commands.public -> dadaia_workspace.infrastructure.codex_doctor
    # context CLI builds the pid probe for bind/alive liveness checks (DI follow-up):
    # lifecycle CLI lazily imports FakeAgentRuntime for the fake harness path (DI follow-up):
    dadaia_workspace.cli.commands.lifecycle -> dadaia_workspace.infrastructure.fake_runtime
