# import-linter contracts — document the cross-platform layering law (release 0.1.8, T-018-07).
#
# ADR-0001 (accepted): the ring rule stays (core imports nothing internal; infrastructure
# imports only core; no upward edge; features never import a sibling feature) but the PORT
# requirement is dropped — a feature or CLI verb imports the concrete infrastructure class
# it is the only consumer of, DIRECTLY. `features-no-infrastructure` and
# `cli-no-infrastructure` (the two contracts that forced every I/O boundary behind a
# core/protocols Protocol wired only by container.py) are DELETED: measured reality was 23
# Protocol classes / 935 LOC of interface text, only 4 with two-or-more production adapters
# (TelemetryRefreshLock, FilePermissionSetter, ShutdownHandler, ProcessAncestry — all OS-
# portability seams), the other 19 existing only to satisfy these two contracts. A Protocol
# lives in core/protocols only where >=2 production adapters exist; that invariant is now
# `tests/contract/test_protocols_have_two_adapters.py`, not an import-linter contract.
#
# The remaining architectural invariants the contracts below describe:
#   (a) features/ must not `import subprocess` directly — the sanctioned boundary is the
#       one infrastructure adapter (git_subprocess/certification_process/subprocess_runner),
#       reached directly now that features-no-infrastructure is gone.
#   (b) core/ must not import OS-primitive modules (fcntl/signal/subprocess/msvcrt) — the
#       only authorized platform-detection site is core/platform.py (which reads `sys`).
#
# IGNORE-EDGE CAP (arch F10, T-010-27): the total number of `ignore_imports` edges across
# ALL contracts below is CAPPED and pinned in tests/contract/test_import_linter_ignore_cap.py.
# Each edge is a SUPPRESSED layering violation. LOWERING the count (deleting an edge after a
# DI cleanup) is encouraged — also lower the cap in that test. RAISING it (adding a new
# ignored edge) requires a rationale comment on the edge here AND a bump of the recorded cap
# in that test, both in the SAME commit, so the architecture debt only ever grows on purpose.
#
# CACHE HYGIENE (v0.1.53 FR3): import-linter's default cache dir (`.import_linter_cache/`)
# is a repo-hygiene violation in the working tree (it must not exist inside any repo — see
# the workspace root AGENTS.md "Repo cleanliness" law). import-linter reads the cache dir
# only from the CLI (`--cache-dir` / `--no-cache`), never from this config, so ALWAYS run
# `lint-imports --no-cache`. The hygiene probe
# `tests/contract/test_import_linter_cache_hygiene.py` runs lint-imports that way and
# asserts no cache dir is left in the tree.

[importlinter]
root_package = dadaia_workspace
include_external_packages = True

[importlinter:contract:features-no-subprocess]
name = features must not import subprocess directly (the ONE process boundary is the infrastructure adapter)
type = forbidden
# Direct imports only (ADR-0001): a feature reaches a process through the concrete
# infrastructure adapter it alone consumes; the audited defect is a feature holding its
# own `import subprocess`. ZERO ignore_imports — a direct edge is never accepted as debt.
allow_indirect_imports = True
source_modules =
    dadaia_workspace.features
forbidden_modules =
    subprocess

[importlinter:contract:core-no-os-primitives]
name = core must not import OS-primitive modules (platform seam is the sole exception)
type = forbidden
source_modules =
    dadaia_workspace.core
forbidden_modules =
    fcntl
    signal
    subprocess
    msvcrt

# REVERSE-DIRECTION CONTRACTS (arch A3, T-010-33): freeze the verified DOWNWARD-ONLY
# layering graph the architect found clean-by-discipline-only. `core` is the bottom
# layer (depends on nothing internal); `infrastructure` depends only on `core`. These
# two `forbidden` contracts pin those facts so a future upward import is caught by
# `lint-imports` (CI-wired since v0.1.54: lint job + preflight)
# instead of silently rotting (the rot that produced the original lock-family audit). Both
# layers are verified to have ZERO upward edges today, so neither needs an
# `ignore_imports` entry — they do not touch the ignore-edge cap (26, per v0.1.54 FR5).

[importlinter:contract:core-no-upper-layers]
name = core must not import features/infrastructure/cli/hooks (core is the bottom layer)
type = forbidden
source_modules =
    dadaia_workspace.core
forbidden_modules =
    dadaia_workspace.features
    dadaia_workspace.infrastructure
    dadaia_workspace.cli
    dadaia_workspace.hooks

[importlinter:contract:infrastructure-no-upper-layers]
name = infrastructure must not import features/cli/hooks (it depends only on core)
type = forbidden
source_modules =
    dadaia_workspace.infrastructure
forbidden_modules =
    dadaia_workspace.features
    dadaia_workspace.cli
    dadaia_workspace.hooks

# v0.1.14 T-014-01 (FR-W4-05, DP-1): the kernel tunables module is the single home for
# lifecycle timing constants. It is a pure-constant leaf — hooks/features/cli all hold a
# legal core edge to it, but it must import NOTHING internal (no reverse dependency on the
# layers that consume it). This `forbidden` contract pins the one-way edge: the tunables
# module never imports features/infrastructure/cli/hooks (the `core-no-upper-layers`
# contract above already covers `core` as a whole; this narrows the guard to the named
# module so a stray edge is reported by `lint-imports` with a precise message once it is
# CI-wired since v0.1.54).
[importlinter:contract:kernel-tunables-is-a-leaf]
name = core.kernel_tunables must import no upper layer (pure-constant single home, DP-1)
type = forbidden
source_modules =
    dadaia_workspace.core.kernel_tunables
forbidden_modules =
    dadaia_workspace.features
    dadaia_workspace.infrastructure
    dadaia_workspace.cli
    dadaia_workspace.hooks

# v0.1.54 FR3 (T-54-11): stop cross-feature erosion. Features must be mutually independent
# (compose via container.py, never by importing a sibling feature). `independence` is the
# canonical import-linter mechanism for mutual sibling independence — a self-referential
# `forbidden` (features -> features) is rejected by import-linter 2.11 with "Modules have
# shared descendants". Every features sub-package is listed under `modules =` so a new edge
# from ANY currently-clean feature is also caught. The surviving cross-feature edges are
# documented as `ignore_imports` (each a suppressed composition-debt exception, counted by
# tests/contract/test_import_linter_ignore_cap.py); no new edge may be added silently.
[importlinter:contract:features-no-cross-feature]
name = features must be mutually independent (compose via container, not sibling imports)
type = independence
modules =
    dadaia_workspace.features.academy
    dadaia_workspace.features.agents
    dadaia_workspace.features.backlog
    dadaia_workspace.features.bugs
    dadaia_workspace.features.capabilities
    dadaia_workspace.features.certification
    dadaia_workspace.features.chokepoints
    dadaia_workspace.features.ci_preflight
    dadaia_workspace.features.export
    dadaia_workspace.features.import_
    dadaia_workspace.features.migrate
    dadaia_workspace.features.panel
    dadaia_workspace.features.public
    dadaia_workspace.features.reconcile
    dadaia_workspace.features.reports
    dadaia_workspace.features.repos
    dadaia_workspace.features.server_registry
    dadaia_workspace.features.spec_context
    dadaia_workspace.features.specs
    dadaia_workspace.features.telemetry
    dadaia_workspace.features.tmp_gc
    dadaia_workspace.features.workspace
    dadaia_workspace.features.workspace_clean
ignore_imports =
    # chokepoints -> spec_context edge REMOVED at v0.5.1 K7: the pre-commit presence
    # read (`others_alive`) is now INJECTED into `pre_commit_decision` rather than
    # imported at module scope — the CLI composition root wires
    # `spec_context.presence.others_alive` straight through, no adapter needed (its
    # signature already matches). Cap lowered 17 -> 16 (-1 features-no-cross-feature).
    # specs.doctor_governance -> backlog.document (1, v0.12.0 T-120-08, SPEC PLAN §6):
    # SPEC-DOC-031/035 re-target reads the single-source BACKLOG.md through the pure
    # document.py parser (leaf -> leaf) instead of re-implementing a second parser inside
    # features/specs/ — the explicitly sanctioned fallback-avoiding path PLAN §6 names.
    dadaia_workspace.features.specs.doctor_governance -> dadaia_workspace.features.backlog.document
    # reconcile.service -> capabilities (2, v0.5.0 T-050-29/A18.5): the post-install
    # transaction reports the converged capabilities snapshot; a feature rewrite (not
    # this task) is required to route it through the container instead — routed to intake.
    dadaia_workspace.features.reconcile.service -> dadaia_workspace.features.capabilities
    # reconcile.service -> migrate.legacy_dadaia_dirs (3, v0.5.0 T-050-29/A18.5): the
    # post-install transaction runs legacy-dir quarantine as one of its migration steps;
    # a feature rewrite (not this task) is required to route it via the container — intake.
    dadaia_workspace.features.reconcile.service -> dadaia_workspace.features.migrate.legacy_dadaia_dirs
    # reconcile.service -> migrate.state_v2 (4, v0.5.0 T-050-29/A18.5): the post-install
    # transaction plans and executes the state-v2 migration as one of its steps; a feature
    # rewrite (not this task) is required to route it via the container — routed to intake.
    dadaia_workspace.features.reconcile.service -> dadaia_workspace.features.migrate.state_v2
    # chokepoints -> specs.canon edge REMOVED at v0.5.1 K7: the push-gate's
    # specs-canon predicates (`canon_violations_fn`/`verdict_violations_fn`) are now
    # INJECTED into `push_gate_decision` rather than imported at module scope
    # (mirroring the same "everything push_gate_decision needs is a parameter"
    # discipline `object_source` already established, FR7/A7.2) — the CLI composition
    # root wires `features.specs.canon.canon_violations`/`verdict_violations` straight
    # through. Cap lowered 16 -> 15 (-1 features-no-cross-feature).

# Release K1 (2026-08-28 deepening audit, "One Invocation"): core/invocation.py holds
# the single session/context/root/mode resolution authority — resolve(), the
# DADAIA.md §3 law verbatim plus rung 0 — and may be imported by exactly three
# sanctioned homes:
#   (1) dadaia_workspace.cli._specs_resolution — the CLI-facing seam
#       (resolve_specs_dir_for_cli / resolve_context_for_cli, and the re-exported
#       CONTEXT_NAME_RE / HARNESS_SESSION_ID_ENV_VARS / sanitize_session_id);
#   (2) dadaia_workspace.container — the sole composition root;
#   (3) dadaia_workspace.hooks — one-shot processes on the write hot path, sanctioned
#       DIRECT importers so no gated tool call pays the composition-root import graph.
# Every other module enumerated below as a source is EVERYTHING outside those homes:
# every cli/commands/* verb module + cli/main.py + cli/anchors.py (a verb reaching the
# resolution internals directly instead of through the seam is exactly the FR1/FR4 bug this
# contract polices — "no further per-command patches accepted for family F2"), plus
# features/infrastructure/hooks (already forbidden from importing core internals by the
# layering contracts above in the general case; this contract names the specific
# resolution-internals target so a stray edge is caught with a precise, actionable message).
# ZERO ignore_imports — a new edge here is never accepted as debt; it must route through the
# seam or the container instead. Does not touch the ignore-edge cap (T-010-27).
[importlinter:contract:bind-resolution-seam-is-a-single-home]
name = only cli._specs_resolution, container and hooks may import core.invocation — the single session/context/root/mode resolution authority (release K1)
type = forbidden
# Direct imports only (mirrors cli-no-infrastructure's precedent): a verb module reaching
# core.invocation TRANSITIVELY through container (the legal composition-root direction,
# cli -> container -> core.invocation) or through cli._specs_resolution (the legal seam
# direction) is fine — the audited defect this contract guards is a verb importing the
# resolution authority DIRECTLY, bypassing the sanctioned homes. core.invocation holds
# exactly one resolution function (resolve(), the DADAIA.md §3 law verbatim) plus its
# thin CLI-facing helpers (resolve_specs_dir/resolve_context_specs_dir) — so this
# contract polices the single authority, not a ladder. Hooks are sanctioned DIRECT
# importers (F-01, v0.5.0 six-axis review): they are one-shot processes on the write
# hot path, and routing them through the container costs ~2s of composition-root
# import graph per gated tool call; the import-surface guard test pins that no hook
# imports dadaia_workspace.container.
allow_indirect_imports = True
source_modules =
    dadaia_workspace.cli.main
    dadaia_workspace.cli.anchors
    dadaia_workspace.cli.commands.academy
    dadaia_workspace.cli.commands.bugs
    dadaia_workspace.cli.commands.ci
    dadaia_workspace.cli.commands.clean
    dadaia_workspace.cli.commands.context
    dadaia_workspace.cli.commands.doctor
    dadaia_workspace.cli.commands.export
    dadaia_workspace.cli.commands.import_
    dadaia_workspace.cli.commands.init
    dadaia_workspace.cli.commands.memory
    dadaia_workspace.cli.commands.migrate
    dadaia_workspace.cli.commands.newartifacts
    dadaia_workspace.cli.commands.panel
    dadaia_workspace.cli.commands.public
    dadaia_workspace.cli.commands.reports
    dadaia_workspace.cli.commands.repos
    dadaia_workspace.cli.commands.server
    dadaia_workspace.cli.commands.specs
    dadaia_workspace.features
    dadaia_workspace.infrastructure
forbidden_modules =
    dadaia_workspace.core.invocation
