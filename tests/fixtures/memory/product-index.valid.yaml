# Valid memory-product-index-v1 fixture
# All required fields present including rank + keywords on each catalog entry (AC-C1-4).
# No changelog/history/versions.
vision_oneliner: >-
  dadaia-workspace is the CLI and library that manages the operator's multi-repo workspace
  as an agentic-native Spec Context Project.

vision_paragraph: >-
  The product solves two problems: (a) fragmentation between agentic tools — each with its
  own format for agents, skills, hooks — and (b) absence of an observable SDD pipeline
  from specification to implementation, with a gate hook that prevents editing production
  without an approved release and an active [-] task.

users:
  - name: "Operador (único humano)"
    description: "Orchestrates work across 15 agents in a 3-tier topology. Activates contexts, approves specs, decides trade-offs."
  - name: "Tier 1 — orchestrators (com tool Agent)"
    description: "project-manager (intake + workflow dispatch), project-auditor (drift detection)."
  - name: "Tier 2 — curator (sem tool Agent)"
    description: "product-engineer: author of SPEC/PLAN/TASKS/CLOSURE and exclusive guardian of specs/memory/*.html in CLOSURE phase."
  - name: "Tier 3 — leaf specialists (12, sem tool Agent)"
    description: "ai-engineer, backend-engineer, code-reviewer, design-specialist, devops-engineer, frontend-engineer, qa-engineer, researcher, security-reviewer, software-architect, software-engineer-node, software-engineer-python."

