<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="36" height="36" aria-hidden="true">
  <title>dadaia workspace rhino</title>
  <!-- Body: large ellipse, semi-transparent fill -->
  <ellipse cx="24" cy="30" rx="17" ry="10"
    fill="currentColor" fill-opacity="0.12"
    stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Head: rounded rectangle, semi-transparent fill -->
  <rect x="30" y="18" width="14" height="11" rx="3" ry="3"
    fill="currentColor" fill-opacity="0.12"
    stroke="currentColor" stroke-width="1.6"/>
  <!-- Horn: filled triangle on snout -->
  <path d="M44 20 L47 14 L44 18 Z"
    fill="currentColor" stroke="none"/>
  <!-- Ear: small filled triangle on top of head -->
  <path d="M33 18 L35 13 L37 18 Z"
    fill="currentColor" stroke="none"/>
  <!-- Eye: small circle -->
  <circle cx="40" cy="22" r="1.5"
    fill="currentColor" stroke="none"/>
  <!-- Front legs -->
  <line x1="16" y1="39" x2="14" y2="46"
    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22" y1="40" x2="21" y2="46"
    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Rear legs -->
  <line x1="28" y1="40" x2="27" y2="46"
    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="34" y1="39" x2="35" y2="46"
    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Tail: open stroke curve -->
  <path d="M7 28 Q3 24 5 20"
    fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>
