<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="36" height="36" aria-hidden="true">
  <title>dadaia workspace mark</title>
  <!-- The workspace: a rounded frame holding stacked spec contexts (bars);
       the accent dot is the bound/active context. Drawn entirely with
       currentColor so every theme recolors the mark. -->
  <rect x="5.5" y="5.5" width="37" height="37" rx="11" fill="none" stroke="currentColor" stroke-width="3.5"/>
  <line x1="14.5" y1="18.5" x2="33.5" y2="18.5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="14.5" y1="26.5" x2="28.5" y2="26.5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="14.5" y1="34.5" x2="23" y2="34.5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
  <circle cx="32.5" cy="34.5" r="3.4" fill="currentColor"/>
</svg>
