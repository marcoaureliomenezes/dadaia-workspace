<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
  <title>dadaia workspace mark</title>
  <!-- Rounded frame = the workspace; bars = stacked spec contexts; the dot is
       the bound/active context. currentColor throughout so themes recolor it. -->
  <rect x="1.85" y="1.85" width="12.3" height="12.3" rx="3.7" fill="none" stroke="currentColor" stroke-width="1.35"/>
  <line x1="4.8" y1="6.2" x2="11.2" y2="6.2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
  <line x1="4.8" y1="8.8" x2="9.5" y2="8.8" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
  <line x1="4.8" y1="11.5" x2="7.7" y2="11.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" opacity="0.45"/>
  <circle cx="10.8" cy="11.5" r="1.15" fill="currentColor"/>
</svg>
