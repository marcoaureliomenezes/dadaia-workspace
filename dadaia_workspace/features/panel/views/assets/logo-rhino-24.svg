<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
  <title>dadaia workspace mark</title>
  <!-- Rounded frame = the workspace; bars = stacked spec contexts; the dot is
       the bound/active context. currentColor throughout so themes recolor it. -->
  <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
  <line x1="7.25" y1="9.25" x2="16.75" y2="9.25" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="7.25" y1="13.25" x2="14.25" y2="13.25" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="7.25" y1="17.25" x2="11.5" y2="17.25" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" opacity="0.45"/>
  <circle cx="16.25" cy="17.25" r="1.7" fill="currentColor"/>
</svg>
